<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>6pence · 경영지원 HQ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+KR:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* ============================================================
   6pence — 사내 경영지원 HQ
   Design system v2
   · 코랄은 강조에만, 정보는 회색 위계로
   · 숫자는 고정폭, 카드는 얇은 그림자, 여백은 넓게
   ============================================================ */

:root{
  /* ground & surface */
  --bg:#faf7f5;
  --paper:#ffffff;
  --paper-2:#fdfaf8;
  --line:#f2eae5;
  --line-strong:#e7dcd5;

  /* ink */
  --ink:#26201d;
  --ink-2:#6b5f58;
  --muted:#a2948c;

  /* brand */
  --coral:#f0603a;
  --coral-deep:#cf4a26;
  --coral-soft:#f7a98d;
  --tint:#fff1ea;
  --tint-2:#ffdccb;
  --peach:#fce4d6;
  --grad:#f0603a;                              /* 면에는 단색만 */
  --grad-soft:linear-gradient(135deg,#fdf1e9 0%,#fbe3d6 100%);   /* 히어로 전용 */

  /* semantic */
  --ok:#0e9c74;      --ok-bg:#e6f6f0;
  --warn:#a9761a;    --warn-bg:#fbf2e1;
  --danger:#dc4340;  --danger-bg:#fdecea;
  --info:#3a72d6;    --info-bg:#ecf2fd;
  --neutral:#6e6762; --neutral-bg:#f1efec;

  --radius:16px; --radius-sm:10px; --radius-lg:20px;
  --shadow:0 1px 2px rgba(74,45,30,.05), 0 6px 18px -14px rgba(74,45,30,.24);
  --shadow-lg:0 24px 60px -28px rgba(74,45,30,.4);
  --sidebar:268px;
  --font:"Inter","Pretendard","Noto Sans KR",-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Segoe UI",sans-serif;
  --num:"Inter","Pretendard","Noto Sans KR",sans-serif;
}

*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:var(--font);
  background:var(--bg);
  color:var(--ink);
  font-size:15px;
  line-height:1.6;
  letter-spacing:-.01em;
  -webkit-font-smoothing:antialiased;
  -moz-osx-font-smoothing:grayscale;
}
a{color:inherit;text-decoration:none}
button{font-family:inherit;cursor:pointer;letter-spacing:-.01em}
input,select,textarea{font-family:inherit;font-size:14px;letter-spacing:-.01em}
:focus-visible{outline:2px solid var(--coral);outline-offset:2px;border-radius:6px}
.mono,.num,td.num,.stat-value,.hero-kpi b,.imp-count b,.dday,.count{
  font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1;
}
::-webkit-scrollbar{width:12px;height:12px}
::-webkit-scrollbar-thumb{background:#e8d9d1;border-radius:20px;border:4px solid transparent;background-clip:content-box}
::-webkit-scrollbar-thumb:hover{background:#d8c4b9;background-clip:content-box}
::-webkit-scrollbar-track{background:transparent}

/* ---------------- shell ---------------- */
.app{display:flex;min-height:100vh}

/* ---------------- sidebar ---------------- */
.sidebar{
  width:var(--sidebar);flex:0 0 var(--sidebar);
  background:var(--paper);border-right:1px solid var(--line);
  height:100vh;position:sticky;top:0;display:flex;flex-direction:column;
}
.brand{padding:26px 24px 20px}
.brand-mark{display:flex;align-items:center;gap:12px}
.brand-dot{
  width:36px;height:36px;border-radius:12px;
  background:linear-gradient(135deg,#f9b18d 0%,#ef6b3f 100%);
  box-shadow:0 6px 14px -8px rgba(240,96,58,.8);
  display:grid;place-items:center;color:#fff;font-weight:700;font-size:13px;letter-spacing:-.03em;
}
.brand-name{font-size:20px;font-weight:800;letter-spacing:-.045em;line-height:1.2}
.brand-sub{font-size:11.5px;color:var(--muted);margin-top:1px;font-weight:500}

.nav{flex:1;overflow-y:auto;padding:6px 14px 28px}
.nav-group{margin-bottom:1px}
.nav-group-btn{
  width:100%;display:flex;align-items:center;gap:11px;
  padding:11px 12px;border:0;background:transparent;border-radius:12px;
  font-size:14px;font-weight:600;color:var(--ink-2);text-align:left;transition:background .12s;
}
.nav-group-btn:hover{background:var(--paper-2)}
.nav-group-btn .chev{margin-left:auto;color:#c9c1bb;transition:transform .2s}
.nav-group.open>.nav-group-btn{color:var(--ink)}
.nav-group.open .chev{transform:rotate(90deg)}
.nav-group-items{display:none;padding:2px 0 10px 34px}
.nav-group.open .nav-group-items{display:block}
.nav-item{
  display:flex;align-items:center;gap:8px;
  padding:8px 12px;border-radius:9px;font-size:13.5px;color:var(--ink-2);
  transition:background .12s,color .12s;
}
.nav-item:hover{background:var(--paper-2);color:var(--ink)}
.nav-item.active{background:var(--tint);color:var(--coral-deep);font-weight:700}
.nav-item .count{margin-left:auto;font-size:12px;color:#bdaea6;font-weight:500}
.nav-item.active .count{color:var(--coral)}
.nav-single{margin-bottom:6px}
.nav-single .nav-group-btn.active{background:var(--tint);color:var(--coral-deep);font-weight:700}

.side-foot{padding:16px 22px 20px;border-top:1px solid var(--line);font-size:11.5px;color:var(--muted);line-height:1.6}
.side-foot b{color:var(--ink-2);font-weight:600}

/* ---------------- topbar ---------------- */
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{
  height:68px;background:rgba(255,255,255,.92);backdrop-filter:saturate(1.6) blur(12px);
  border-bottom:1px solid var(--line);position:sticky;top:0;z-index:40;
  display:flex;align-items:center;gap:16px;padding:0 32px;
}
.crumb{font-size:13px;color:var(--muted);font-weight:500}
.crumb b{color:var(--ink);font-weight:700}
.topbar-spacer{flex:1}
.top-search{
  display:flex;align-items:center;gap:9px;background:var(--bg);
  border:1px solid transparent;border-radius:12px;padding:9px 14px;width:292px;transition:.15s;
}
.top-search:focus-within{background:var(--paper);border-color:var(--line-strong);box-shadow:var(--shadow)}
.top-search input{border:0;background:transparent;outline:none;width:100%;font-size:13.5px}
.top-search input::placeholder{color:#b0a8a2}
.avatar{
  width:36px;height:36px;border-radius:12px;background:var(--tint);
  display:grid;place-items:center;font-size:12px;font-weight:700;color:var(--coral-deep);
}
.icon-btn{
  width:36px;height:36px;border-radius:11px;border:0;
  background:transparent;color:var(--ink-2);display:grid;place-items:center;
}
.icon-btn:hover{background:var(--bg)}

.content{padding:34px 32px 72px;max-width:1460px;width:100%}

/* ---------------- page header ---------------- */
.page-head{display:flex;align-items:flex-end;gap:20px;margin-bottom:26px;flex-wrap:wrap}
.eyebrow{
  font-size:12px;font-weight:700;letter-spacing:.02em;color:var(--muted);
  margin-bottom:8px;text-transform:none;
}
.page-title{font-size:30px;font-weight:800;letter-spacing:-.045em;margin:0;line-height:1.25}
.page-desc{font-size:14px;color:var(--ink-2);margin-top:8px;max-width:760px}
.page-head-actions{margin-left:auto;display:flex;gap:8px;align-items:center}
.section-title{font-size:13px;font-weight:700;color:var(--ink-2);letter-spacing:-.01em;margin:34px 0 14px}

/* ---------------- buttons ---------------- */
.btn{
  display:inline-flex;align-items:center;gap:7px;border-radius:12px;
  padding:11px 17px;font-size:13.5px;font-weight:600;border:1px solid var(--line-strong);
  background:var(--paper);color:var(--ink);transition:.14s;white-space:nowrap;
}
.btn:hover{background:var(--paper-2);border-color:#d6d0ca}
.btn-primary{background:var(--coral);border-color:var(--coral);color:#fff}
.btn-primary:hover{background:var(--coral-deep);border-color:var(--coral-deep);color:#fff}
.btn-primary:disabled{background:#e8e4e0;border-color:#e8e4e0;color:#b0a8a2;cursor:default}
.btn-ghost{border-color:transparent;background:transparent;color:var(--muted)}
.btn-ghost:hover{background:var(--bg);color:var(--ink);border-color:transparent}
.btn-sm{padding:8px 13px;font-size:13px;border-radius:10px}
.btn-danger{color:var(--danger);border-color:#f2d9d8;background:var(--paper)}
.btn-danger:hover{background:var(--danger-bg);border-color:#eec6c4;color:var(--danger)}

/* ---------------- cards ---------------- */
.card{background:var(--paper);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}
.card-head{padding:20px 24px 16px;display:flex;align-items:center;gap:10px}
.card-title{font-size:16px;font-weight:700;letter-spacing:-.03em}
.card-title .sub{font-weight:500;color:var(--muted);font-size:13px;margin-left:8px;letter-spacing:-.01em}
.card-head .right{margin-left:auto;font-size:13px;color:var(--muted);font-weight:500}
.card-body{padding:4px 24px 24px}

/* ---------------- stats ---------------- */
.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(215px,1fr));gap:14px;margin-bottom:22px}
.stat{
  background:var(--paper);border-radius:var(--radius);
  padding:22px 22px 20px;box-shadow:var(--shadow);position:relative;
  transition:box-shadow .15s,transform .15s;
}
a.stat:hover{box-shadow:0 2px 4px rgba(23,21,19,.05), 0 14px 30px -20px rgba(23,21,19,.3);transform:translateY(-1px)}
.stat-label{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:6px;font-weight:500}
.stat-value{font-size:30px;font-weight:800;letter-spacing:-.05em;margin-top:10px;line-height:1.15}
.stat.accent .stat-value{color:var(--coral-deep)}
.stat-value .unit{font-size:14px;font-weight:600;color:var(--muted);margin-left:3px;letter-spacing:-.01em}
.stat-foot{font-size:12.5px;color:var(--muted);margin-top:9px;display:flex;align-items:center;gap:6px;font-weight:500}
.trend-up{color:var(--ok);font-weight:700}
.trend-down{color:var(--danger);font-weight:700}

.grid-2{display:grid;grid-template-columns:1.5fr 1fr;gap:16px;align-items:start}
.grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;align-items:start}
@media(max-width:1120px){.grid-2,.grid-3{grid-template-columns:1fr}}

/* ---------------- hero ---------------- */
.hero{
  background:var(--grad-soft);border-radius:var(--radius-lg);box-shadow:var(--shadow);
  padding:28px 30px;margin-bottom:20px;display:flex;align-items:center;gap:28px;flex-wrap:wrap;
}
.hero h2{margin:0;font-size:24px;letter-spacing:-.045em;font-weight:800}
.hero p{margin:9px 0 0;font-size:14px;color:var(--ink-2);max-width:620px}
.hero p b{color:var(--ink);font-weight:700}
.hero-side{margin-left:auto;display:flex;gap:14px}
.hero-kpi{
  text-align:right;background:rgba(255,255,255,.66);border-radius:14px;padding:14px 18px;min-width:118px;
}
.hero-kpi b{display:block;font-size:22px;letter-spacing:-.045em;font-weight:800;line-height:1.2}
.hero-kpi span{font-size:12px;color:var(--muted);font-weight:500}

/* ---------------- toolbar ---------------- */
.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:16px}
.field{
  display:flex;align-items:center;gap:9px;background:var(--paper);
  border:1px solid var(--line-strong);border-radius:12px;padding:10px 14px;transition:.14s;
}
.field:focus-within{border-color:var(--coral-soft);box-shadow:0 0 0 3px var(--tint)}
.field input,.field select{border:0;outline:none;background:transparent;min-width:130px;font-size:13.5px}
.field label{font-size:13px;color:var(--muted);white-space:nowrap;font-weight:500}
.chip{
  padding:8px 14px;border-radius:10px;border:1px solid transparent;
  background:var(--paper);font-size:13px;color:var(--ink-2);font-weight:600;transition:.14s;
}
.chip:hover{background:var(--paper-2)}
.chip.on{background:var(--tint);border-color:var(--coral-soft);color:var(--coral-deep)}
.toolbar .right{margin-left:auto;display:flex;gap:10px;align-items:center;font-weight:500}

/* ---------------- table ---------------- */
.table-wrap{overflow-x:auto;border-radius:var(--radius);background:var(--paper);box-shadow:var(--shadow)}
table{width:100%;border-collapse:collapse;font-size:14px}
thead th{
  background:#fefaf8;text-align:left;font-weight:600;color:var(--ink-2);font-size:12.5px;
  padding:15px 18px;border-bottom:1px solid var(--line);white-space:nowrap;position:sticky;top:0;
  letter-spacing:-.01em;
}
thead th.sortable{cursor:pointer;user-select:none;transition:color .12s}
thead th.sortable:hover{color:var(--ink)}
thead th .arw{opacity:.5;font-size:9px;margin-left:4px}
tbody td{padding:15px 18px;border-bottom:1px solid #f7efeb;vertical-align:middle;white-space:nowrap;color:var(--ink-2)}
tbody tr:last-child td{border-bottom:0}
tbody tr:hover{background:#fffbf9}
tbody tr.sel{background:var(--tint)}
tbody tr.sel:hover{background:var(--tint)}
td.num{text-align:right;color:var(--ink);font-weight:600}
td.wrap{white-space:normal;min-width:220px}
.cell-main{font-weight:700;color:var(--ink)}
.cell-sub{font-size:12px;color:var(--muted)}
.row-actions{display:flex;gap:2px;justify-content:flex-end}
.row-actions button{
  border:0;background:transparent;color:var(--muted);border-radius:8px;padding:6px 10px;
  font-size:12.5px;font-weight:600;transition:.12s;
}
.row-actions button:hover{background:var(--bg);color:var(--ink)}
.row-actions button.del:hover{background:var(--danger-bg);color:var(--danger)}
th.chk,td.chk{width:46px;padding-right:0}
.chk input{width:16px;height:16px;accent-color:var(--coral);cursor:pointer;margin:0;display:block}

/* ---------------- badge ---------------- */
.badge{
  display:inline-flex;align-items:center;padding:5px 10px;border-radius:8px;
  font-size:12.5px;font-weight:700;background:var(--neutral-bg);color:var(--neutral);
  white-space:nowrap;letter-spacing:-.01em;
}
.badge.ok{background:var(--ok-bg);color:var(--ok)}
.badge.warn{background:var(--warn-bg);color:var(--warn)}
.badge.danger{background:var(--danger-bg);color:var(--danger)}
.badge.info{background:var(--info-bg);color:var(--info)}
.badge.coral{background:var(--tint);color:var(--coral-deep)}
.badge.plain{background:transparent;padding-left:0;padding-right:0;color:var(--muted)}

.avatar-sm{
  width:28px;height:28px;border-radius:9px;background:var(--tint);color:var(--coral-deep);
  display:inline-grid;place-items:center;font-size:11.5px;font-weight:700;margin-right:9px;
  vertical-align:middle;letter-spacing:-.02em;
}
.person{display:flex;align-items:center;color:var(--ink)}

/* ---------------- pager ---------------- */
.pager{display:flex;align-items:center;gap:12px;padding:16px 18px;font-size:13px;color:var(--muted);font-weight:500;border-top:1px solid var(--line)}
.pager .right{margin-left:auto;display:flex;gap:4px}
.pager button{
  border:1px solid transparent;background:transparent;border-radius:9px;
  min-width:32px;height:32px;font-size:13px;color:var(--ink-2);font-weight:600;
}
.pager button:hover:not(:disabled){background:var(--bg)}
.pager button.on{background:var(--tint);color:var(--coral-deep)}
.pager button:disabled{opacity:.35;cursor:default}
.pager select{
  border:1px solid var(--line-strong);background:var(--paper);border-radius:9px;
  padding:6px 9px;font-size:12.5px;color:var(--ink-2);outline:none;font-weight:500;
}

.empty{padding:72px 20px;text-align:center;color:var(--muted);font-size:14px}
.empty .ic-lg{color:#e3d2c8;width:38px;height:38px;stroke-width:1.3}

/* ---------------- 다중 선택 바 ---------------- */
.bulkbar{
  display:flex;align-items:center;gap:14px;flex-wrap:wrap;
  background:var(--coral-deep);color:#fff;border-radius:14px;
  padding:13px 18px;margin-bottom:14px;box-shadow:0 10px 24px -14px rgba(207,74,38,.85);
}
.bulkbar b{font-size:14px;font-weight:700}
.bulkbar .sep{width:1px;height:18px;background:rgba(255,255,255,.2)}
.bulkbar select{
  background:rgba(255,255,255,.14);border:0;color:#fff;
  border-radius:9px;padding:7px 11px;outline:none;font-weight:600;
}
.bulkbar select option{color:var(--coral-deep)}
.bulkbar .lbl{font-size:13px;color:rgba(255,255,255,.65);font-weight:500}
.bulkbar .right{margin-left:auto;display:flex;gap:6px}
.bulkbar button{
  border:0;background:rgba(255,255,255,.12);color:#fff;
  border-radius:9px;padding:7px 13px;font-size:13px;font-weight:600;transition:.12s;
}
.bulkbar button:hover{background:rgba(255,255,255,.22)}
.bulkbar button.solid{background:#fff;color:var(--coral-deep)}
.bulkbar button.solid:hover{background:#f0ece9}
.bulkbar button.warnbtn:hover{background:rgba(0,0,0,.28)}

/* ---------------- modal ---------------- */
.overlay{
  position:fixed;inset:0;background:rgba(23,21,19,.32);backdrop-filter:blur(4px);
  z-index:100;display:flex;align-items:flex-start;justify-content:center;padding:60px 20px;overflow-y:auto;
}
.modal{
  background:var(--paper);border-radius:var(--radius-lg);width:100%;max-width:680px;
  box-shadow:var(--shadow-lg);animation:pop .2s cubic-bezier(.2,.8,.3,1);
}
.modal.wide{max-width:940px}
@keyframes pop{from{opacity:0;transform:translateY(8px) scale(.99)}to{opacity:1;transform:none}}
.modal-head{padding:26px 28px 20px;display:flex;align-items:center}
.modal-head h3{margin:0;font-size:20px;font-weight:800;letter-spacing:-.04em}
.modal-head .sub{font-size:13px;color:var(--muted);margin-top:5px}
.modal-body{padding:4px 28px 24px;max-height:64vh;overflow-y:auto}
.modal-foot{
  padding:18px 28px;border-top:1px solid var(--line);
  display:flex;gap:8px;justify-content:flex-end;
}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.form-row{display:flex;flex-direction:column;gap:7px}
.form-row.full{grid-column:1/-1}
.form-row label{font-size:13px;font-weight:600;color:var(--ink-2)}
.form-row label .req{color:var(--coral)}
.form-row input,.form-row select,.form-row textarea{
  border:1px solid var(--line-strong);border-radius:12px;padding:12px 14px;outline:none;
  background:var(--paper);color:var(--ink);width:100%;font-size:14px;transition:.14s;
}
.form-row input:hover,.form-row select:hover{border-color:#d6d0ca}
.form-row input:focus,.form-row select:focus,.form-row textarea:focus{
  border-color:var(--coral);box-shadow:0 0 0 3px var(--tint);
}
.form-row input[readonly]{
  background:var(--tint);border-color:transparent;color:var(--coral-deep);font-weight:700;cursor:default;
}
.form-row input[readonly]:hover{border-color:transparent}
.form-row textarea{min-height:92px;resize:vertical;line-height:1.65}
.form-hint{font-size:12px;color:var(--muted)}
.auto-tag{
  float:right;font-size:11px;font-weight:700;color:var(--coral-deep);
  background:var(--tint);padding:2px 8px;border-radius:6px;
}
.money-echo{font-size:12px;color:var(--muted);min-height:16px;font-weight:600}
.ym{display:flex;gap:9px}
.ym select{flex:1}

/* ---------------- charts ---------------- */
.bars{display:flex;align-items:flex-end;gap:12px;height:186px;padding-top:12px;border-bottom:1px solid var(--line)}
.bar-col{flex:1;display:flex;flex-direction:column;align-items:center;gap:0;height:100%;justify-content:flex-end}
.bar-stack{width:100%;max-width:56px;margin:0 auto;display:flex;flex-direction:column;justify-content:flex-end;height:100%;gap:2px}
.bar{width:100%;border-radius:6px;background:var(--coral);min-height:3px;transition:height .35s cubic-bezier(.2,.8,.3,1)}
.bar.alt{background:var(--peach)}
.bar-label{font-size:12px;color:var(--muted);font-weight:600;padding-top:11px}
.legend{display:flex;gap:16px;font-size:12.5px;color:var(--muted);margin-top:14px;flex-wrap:wrap;font-weight:500}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block;margin-right:6px;vertical-align:-1px}

.donut{width:156px;height:156px;border-radius:50%;position:relative;flex:0 0 auto}
.donut::after{content:"";position:absolute;inset:30px;background:var(--paper);border-radius:50%}
.donut-center{position:absolute;inset:0;display:grid;place-items:center;z-index:2;text-align:center}
.donut-center b{font-size:26px;display:block;letter-spacing:-.05em;font-weight:800}
.donut-center span{font-size:12px;color:var(--muted);font-weight:500}

.progress{height:7px;border-radius:99px;background:var(--tint);overflow:hidden}
.progress i{display:block;height:100%;background:var(--coral);border-radius:99px;transition:width .35s}

/* ---------------- lists ---------------- */
.list-row{display:flex;align-items:center;gap:14px;padding:15px 24px;border-bottom:1px solid #f7efeb;transition:background .12s}
.list-row:last-child{border-bottom:0}
.list-row:hover{background:#fffbf9}
.list-main{flex:1;min-width:0}
.list-main .t{font-size:14px;font-weight:600;color:var(--ink)}
.list-main .s{font-size:12.5px;color:var(--muted);margin-top:3px;font-weight:500}
.dday{
  font-size:12.5px;font-weight:700;padding:5px 10px;border-radius:8px;
  background:var(--tint);color:var(--coral-deep);white-space:nowrap;
}
.dday.soon{background:var(--danger-bg);color:var(--danger)}
.dday.done{background:var(--neutral-bg);color:var(--neutral)}

/* ---------------- 월 마감 ---------------- */
.switch{display:inline-flex;align-items:center;gap:9px;cursor:pointer;user-select:none}
.switch input{display:none}
.switch .track{
  width:44px;height:26px;border-radius:99px;background:#e6d9d1;
  position:relative;transition:.18s;flex:0 0 auto;
}
.switch .knob{
  position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;
  background:#fff;transition:.18s;box-shadow:0 1px 3px rgba(0,0,0,.18);
}
.switch input:checked + .track{background:var(--coral)}
.switch input:checked + .track .knob{transform:translateX(18px)}
.switch-label{font-size:13.5px;font-weight:600;color:var(--ink-2)}
.switch.sm .track{width:36px;height:21px}
.switch.sm .knob{width:15px;height:15px}
.switch.sm input:checked + .track .knob{transform:translateX(15px)}
.src-row{display:flex;align-items:flex-start;gap:16px;padding:18px 24px;border-bottom:1px solid #f7efeb}
.src-row:last-of-type{border-bottom:0}
.src-toggle{padding-top:2px;min-width:50px}

/* ---------------- 일괄 등록 ---------------- */
.imp-steps{display:flex;flex-direction:column;gap:16px}
.imp-box{border-radius:14px;padding:20px 22px;background:#fdf6f2}
.imp-box h4{margin:0 0 10px;font-size:14px;font-weight:700;display:flex;align-items:center;gap:9px;letter-spacing:-.02em}
.imp-box .step-no{
  width:21px;height:21px;border-radius:7px;background:var(--coral);color:#fff;
  display:grid;place-items:center;font-size:11.5px;font-weight:700;
}
.imp-box p{margin:0 0 12px;font-size:13px;color:var(--ink-2);line-height:1.7}
.col-chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.col-chip{
  font-size:12.5px;padding:5px 11px;border-radius:8px;background:var(--paper);
  color:var(--ink-2);font-weight:500;
}
.col-chip.req{background:var(--tint);color:var(--coral-deep);font-weight:700}
#imp-text{
  width:100%;min-height:160px;border:1px solid var(--line-strong);border-radius:12px;padding:14px;
  font-family:"SF Mono",ui-monospace,Menlo,monospace;font-size:12.5px;line-height:1.75;resize:vertical;
  outline:none;background:var(--paper);
}
#imp-text:focus{border-color:var(--coral);box-shadow:0 0 0 3px var(--tint)}
.file-btn{
  display:inline-flex;align-items:center;gap:8px;border:1px dashed var(--line-strong);
  border-radius:12px;padding:11px 16px;font-size:13px;color:var(--ink-2);cursor:pointer;
  background:var(--paper);font-weight:600;transition:.14s;
}
.file-btn:hover{border-color:var(--coral-soft);color:var(--coral-deep)}
.imp-summary{display:flex;align-items:center;gap:18px;flex-wrap:wrap;font-size:13.5px;color:var(--muted);font-weight:500}
.imp-count{display:flex;align-items:baseline;gap:5px;color:var(--ink-2)}
.imp-count b{font-size:21px;font-weight:800;letter-spacing:-.04em}
.imp-count.ok b{color:var(--ok)}
.imp-count.bad b{color:var(--danger)}
.imp-preview{max-height:300px;overflow:auto;border-radius:12px;margin-top:14px;background:var(--paper)}
.imp-preview table{font-size:12.5px}
.imp-preview thead th{padding:11px 13px;background:var(--paper)}
.imp-preview tbody td{padding:10px 13px}
.imp-preview td.bad{background:var(--danger-bg);color:var(--danger);font-weight:700}
.imp-preview tr.badrow td:first-child{color:var(--danger);font-weight:800}
.err-note{font-size:12.5px;color:var(--danger);margin-top:9px;line-height:1.7}
.note{
  font-size:13px;color:var(--ink-2);background:var(--tint);border-radius:12px;
  padding:12px 15px;display:flex;gap:10px;align-items:flex-start;line-height:1.65;
}
.note .ic{color:var(--coral);flex:0 0 auto;margin-top:2px}

/* ---------------- 문서 ---------------- */
.doc-layout{display:grid;grid-template-columns:240px 1fr;gap:20px;align-items:start}
@media(max-width:940px){.doc-layout{grid-template-columns:1fr}}
.doc-toc{position:sticky;top:88px}
.doc-toc a{display:block;padding:10px 14px;border-radius:10px;font-size:13.5px;color:var(--ink-2);font-weight:500}
.doc-toc a:hover{background:var(--bg)}
.doc-toc a.on{background:var(--tint);color:var(--coral-deep);font-weight:700}
.doc-body{padding:38px 44px 44px;line-height:1.9;max-width:820px}
.doc-body h2{font-size:21px;margin:40px 0 16px;letter-spacing:-.04em;font-weight:800}
.doc-body h2:first-child{margin-top:0}
.doc-body h3{font-size:15px;margin:26px 0 9px;font-weight:700;color:var(--ink)}
.doc-body p{margin:0 0 14px;color:var(--ink-2);font-size:14.5px}
.doc-body ul,.doc-body ol{margin:0 0 16px;padding-left:22px;color:var(--ink-2);font-size:14.5px}
.doc-body li{margin-bottom:7px}
.doc-body b{color:var(--ink)}
.doc-meta{display:flex;gap:20px;font-size:12.5px;color:var(--muted);margin-bottom:26px;padding-bottom:20px;border-bottom:1px solid var(--line);font-weight:500}
.doc-meta b{color:var(--ink-2);font-weight:700}
.doc-body table{margin:8px 0 20px;border-radius:12px;overflow:hidden;background:var(--bg)}
.doc-body td,.doc-body th{white-space:normal;font-size:13.5px}
.doc-body thead th{background:var(--bg)}
.doc-body code{background:var(--tint);color:var(--coral-deep);padding:2px 7px;border-radius:6px;font-size:13px}

/* ---------------- toast ---------------- */
.toast-wrap{position:fixed;bottom:30px;left:50%;transform:translateX(-50%);z-index:200;display:flex;flex-direction:column;gap:8px}
.toast{
  background:#2f2521;color:#fff;padding:13px 22px;border-radius:12px;font-size:13.5px;font-weight:600;
  box-shadow:var(--shadow-lg);animation:slideUp .2s;display:flex;align-items:center;gap:10px;
}
.toast .ic{color:#7ee0bd}
@keyframes slideUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* ---------------- misc ---------------- */
.ic{
  width:19px;height:19px;flex:0 0 auto;display:inline-block;vertical-align:-4px;
  fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;
}
.ic-sm{width:16px;height:16px;vertical-align:-3px;stroke-width:1.8}
.ic-lg{width:28px;height:28px;stroke-width:1.4}
.nav-group-btn .ic{color:#bcaaa0}
.nav-group.open>.nav-group-btn .ic,.nav-group-btn.active .ic{color:var(--coral)}
.kbd{
  font-size:11px;border-radius:6px;padding:3px 6px;color:var(--muted);
  background:#f3e8e2;font-weight:600;
}
.hr{height:1px;background:var(--line);margin:26px 0}
.muted{color:var(--muted)}
.right-align{text-align:right}

@media(max-width:900px){
  .sidebar{position:fixed;z-index:60;transform:translateX(-100%);transition:.25s;box-shadow:var(--shadow-lg)}
  .sidebar.show{transform:none}
  .content{padding:22px 16px 56px}
  .topbar{padding:0 16px}
  .top-search{width:auto;flex:1}
  .form-grid{grid-template-columns:1fr}
  .page-title{font-size:25px}
  .hero-side{width:100%}
}

/* 목록 화면 요약 — 대시보드보다 가볍게 */
.stat-grid.compact{grid-template-columns:repeat(auto-fit,minmax(178px,1fr));gap:12px;margin-bottom:18px}
.stat-grid.compact .stat{padding:16px 18px 15px}
.stat-grid.compact .stat-label{font-size:12.5px}
.stat-grid.compact .stat-value{font-size:23px;margin-top:6px}

/* 행 액션은 마우스를 올렸을 때만 (표가 훨씬 조용해집니다) */
@media (hover:hover){
  .row-actions button{opacity:0;transition:opacity .12s,background .12s,color .12s}
  tbody tr:hover .row-actions button,
  .row-actions button:focus-visible{opacity:1}
}

/* 데이터 관리 화면 행 액션 */
.data-actions{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.data-actions .btn:disabled{opacity:.4;cursor:default}

/* ---- 대시보드 바로 하기 ---- */
.quick-grid{
  display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));
  gap:14px;margin-bottom:22px;
}
.quick{
  text-align:left;background:var(--paper);border:0;border-radius:var(--radius);
  padding:22px 22px 20px;box-shadow:var(--shadow);cursor:pointer;
  transition:transform .15s,box-shadow .15s;color:var(--ink);
  display:flex;flex-direction:column;gap:2px;
}
.quick:hover{transform:translateY(-2px);box-shadow:0 2px 6px rgba(74,45,30,.07), 0 18px 34px -22px rgba(74,45,30,.5)}
.quick .ic-lg{color:var(--coral);margin-bottom:12px}
.q-title{font-size:17px;font-weight:800;letter-spacing:-.035em}
.q-desc{font-size:12.5px;color:var(--muted);font-weight:500;line-height:1.5;margin-top:4px}
.quick.primary{background:var(--coral);color:#fff}
.quick.primary .ic-lg{color:#fff}
.quick.primary .q-desc{color:rgba(255,255,255,.82)}
.quick.primary:hover{background:var(--coral-deep)}

.shortcut-row{display:flex;flex-wrap:wrap;gap:8px}
.shortcut{
  display:inline-flex;align-items:center;gap:7px;background:var(--paper);
  border-radius:11px;padding:11px 16px;font-size:13.5px;font-weight:600;
  color:var(--ink-2);box-shadow:var(--shadow);transition:.14s;
}
.shortcut:hover{color:var(--coral-deep);transform:translateY(-1px)}
.shortcut .ic{color:var(--muted)}
.shortcut:hover .ic{color:var(--coral)}

/* ---- 리스크 레이더 ---- */
.risk-wrap{
  background:var(--paper);border-radius:var(--radius-lg);box-shadow:var(--shadow);
  padding:22px 24px 24px;margin-bottom:20px;border-top:3px solid var(--coral);
}
.risk-wrap.ok{border-top-color:var(--ok)}
.risk-head{display:flex;align-items:center;gap:14px;margin-bottom:18px}
.risk-head .ic-lg{color:var(--coral);flex:0 0 auto}
.risk-wrap.ok .risk-head .ic-lg{color:var(--ok)}
.risk-wrap.ok .risk-head{margin-bottom:0}
.risk-title{font-size:18px;font-weight:800;letter-spacing:-.035em}
.risk-title b{color:var(--coral-deep)}
.risk-title b.hi{color:var(--danger)}
.risk-sub{font-size:12.5px;color:var(--muted);margin-top:3px;font-weight:500}
.risk-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(252px,1fr));gap:12px}
.risk-card{
  display:block;background:var(--bg);border-radius:14px;padding:16px 17px 14px;
  transition:.15s;border-left:3px solid var(--line-strong);
}
.risk-card:hover{background:#fff;box-shadow:var(--shadow);transform:translateY(-1px)}
.risk-card.high{border-left-color:var(--danger)}
.risk-card.mid{border-left-color:var(--warn)}
.risk-card.low{border-left-color:var(--info)}
.risk-card-top{display:flex;align-items:center;gap:8px;margin-bottom:9px}
.risk-badge{font-size:11px;font-weight:800;padding:3px 8px;border-radius:6px;background:var(--neutral-bg);color:var(--neutral)}
.risk-badge.high{background:var(--danger-bg);color:var(--danger)}
.risk-badge.mid{background:var(--warn-bg);color:var(--warn)}
.risk-badge.low{background:var(--info-bg);color:var(--info)}
.risk-count{margin-left:auto;font-size:17px;font-weight:800;letter-spacing:-.03em}
.risk-card-title{font-size:14px;font-weight:700;letter-spacing:-.02em}
.risk-amount{font-size:13px;font-weight:700;color:var(--coral-deep);margin-top:3px}
.risk-sample{margin-top:9px;display:flex;flex-direction:column;gap:4px}
.risk-sample .rs{display:flex;gap:8px;font-size:11.5px;color:var(--ink-2);justify-content:space-between}
.risk-sample .rs span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.risk-sample .rs em{font-style:normal;color:var(--muted);white-space:nowrap;flex:0 0 auto}
.risk-sample .more{color:var(--muted);font-size:11px}
.risk-note{margin-top:10px;font-size:11.5px;color:var(--muted);line-height:1.5;border-top:1px solid var(--line);padding-top:8px}

/* ---- 경영 브리핑 (인쇄용) ---- */
.brief-actions{display:flex;gap:8px;justify-content:flex-end;margin-bottom:16px}
.paper{
  background:var(--paper);border-radius:var(--radius);box-shadow:var(--shadow);
  padding:44px 48px 36px;max-width:1000px;margin:0 auto;
}
.paper-head{display:flex;align-items:flex-end;border-bottom:2px solid var(--ink);padding-bottom:18px;margin-bottom:24px}
.paper-eyebrow{font-size:12.5px;color:var(--muted);font-weight:600;letter-spacing:.02em}
.paper h1{font-size:30px;font-weight:800;letter-spacing:-.045em;margin:6px 0 0}
.paper-date{margin-left:auto;text-align:right}
.paper-date b{display:block;font-size:15px;font-weight:700}
.paper-date span{font-size:12.5px;color:var(--muted)}
.paper-kpis{display:grid;grid-template-columns:repeat(6,1fr);gap:1px;background:var(--line);
  border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-bottom:28px}
.paper-kpis>div{background:var(--paper);padding:16px 14px}
.paper-kpis span{display:block;font-size:11.5px;color:var(--muted);font-weight:600}
.paper-kpis b{display:block;font-size:22px;font-weight:800;letter-spacing:-.04em;margin-top:5px}
.paper-kpis b i{font-style:normal;font-size:12px;font-weight:600;color:var(--muted);margin-left:2px}
.paper-kpis .up{font-size:11.5px;font-weight:700;color:var(--ok)}
.paper-kpis .down{font-size:11.5px;font-weight:700;color:var(--danger)}
.paper-kpis .sub{font-size:11px;color:var(--muted);font-weight:500}
.paper-cols{display:grid;grid-template-columns:1fr 1fr;gap:28px 34px}
.paper section h2{font-size:14.5px;font-weight:800;letter-spacing:-.02em;margin:0 0 10px;
  padding-bottom:7px;border-bottom:1px solid var(--line)}
.paper-table{width:100%;border-collapse:collapse;font-size:12.5px}
.paper-table th{text-align:left;font-weight:600;color:var(--muted);font-size:11.5px;padding:6px 8px;border-bottom:1px solid var(--line)}
.paper-table td{padding:7px 8px;border-bottom:1px solid #f5f0ed;color:var(--ink-2);white-space:normal}
.paper-table td:first-child{color:var(--ink);font-weight:600;white-space:nowrap}
.paper-table .r{text-align:right;font-variant-numeric:tabular-nums}
.paper-table em{font-style:normal;color:var(--muted);font-size:11px;margin-left:3px}
.paper-table td.late{color:var(--danger)}
.paper .tag{font-size:10.5px;font-weight:800;padding:2px 7px;border-radius:5px;background:var(--neutral-bg);color:var(--neutral)}
.paper .tag.high{background:var(--danger-bg);color:var(--danger)}
.paper .tag.mid{background:var(--warn-bg);color:var(--warn)}
.paper .tag.low{background:var(--info-bg);color:var(--info)}
.paper .none{font-size:12.5px;color:var(--muted);padding:10px 0}
.paper .hint{font-size:11.5px;color:var(--danger);margin-top:8px}
.paper-foot{margin-top:30px;padding-top:14px;border-top:1px solid var(--line);
  font-size:11px;color:var(--muted);text-align:center}
@media(max-width:900px){.paper{padding:26px 20px}.paper-kpis{grid-template-columns:repeat(2,1fr)}.paper-cols{grid-template-columns:1fr}}

@media print{
  .sidebar,.topbar,.brief-actions,.toast-wrap{display:none !important}
  body{background:#fff}
  .content{padding:0;max-width:none}
  .paper{box-shadow:none;border-radius:0;padding:0;max-width:none}
  .paper-cols{gap:20px 28px}
  section{break-inside:avoid}
  @page{margin:14mm}
}

</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-mark">
        <div class="brand-dot">6p</div>
        <div>
          <div class="brand-name">6pence</div>
          <div class="brand-sub">경영지원 HQ</div>
        </div>
      </div>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="side-foot">
      <div id="sync-line"><b>프로토타입</b> · 데이터는 이 브라우저에만 저장됩니다</div>
      <button class="btn btn-sm btn-ghost" id="reset-btn" style="margin-top:8px;padding-left:0"><svg class="ic ic-sm" viewBox="0 0 24 24"><path d="M20.2 11.4A8.2 8.2 0 0 0 6.4 6.7L3.8 9.1"/><path d="M3.8 4.6v4.6h4.6"/><path d="M3.8 12.6a8.2 8.2 0 0 0 13.8 4.7l2.6-2.4"/><path d="M20.2 19.4v-4.6h-4.6"/></svg> 샘플 데이터 초기화</button>
    </div>
  </aside>

  <main class="main">
    <header class="topbar">
      <button class="icon-btn" id="menu-btn" title="메뉴"><svg class="ic" viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
      <div class="crumb" id="crumb"></div>
      <div class="topbar-spacer"></div>
      <div class="top-search" style="position:relative">
        <svg class="ic ic-sm" viewBox="0 0 24 24" style="color:var(--muted)"><circle cx="10.8" cy="10.8" r="6.4"/><path d="M15.6 15.6 20 20"/></svg>
        <input id="gsearch" placeholder="전체 검색 (사람·문서·거래처…)" autocomplete="off">
        <span class="kbd">⌘K</span>
        <div id="search-result" class="card" style="display:none;position:absolute;top:44px;left:0;width:380px;max-height:420px;overflow-y:auto;z-index:60"></div>
      </div>
      <div class="avatar" title="관리자">관리</div>
    </header>
    <div class="content" id="content"></div>
  </main>
</div>
<script>
const DEMO_AUTOSEED = true;
/* ============================================================
   schema.js — 메뉴 구조 + 컬렉션(테이블) 정의
   필드 타입: text | money | num | date | select | textarea | person | percent
   ============================================================ */

const DEPTS = ["경영지원","마케팅","영업","연구개발","생산","디자인","IT"];
const POSITIONS = ["사원","주임","대리","과장","차장","부장","이사","대표"];

/* ------------------------------------------------------------
   자동 계산 헬퍼 (calc 필드에서 사용)
   ------------------------------------------------------------ */
const N = v => (v===""||v==null||isNaN(Number(v))) ? 0 : Number(v);
const has = v => v!==""&&v!=null&&!isNaN(Number(v));
const round1 = n => Math.round(n*10)/10;
const VAT = 0.1;
/* 시작일~종료일 일수 (양끝 포함) */
const dspan = (a,b)=>{
  if(!a||!b) return "";
  const x = new Date(a+"T00:00:00"), y = new Date(b+"T00:00:00");
  if(isNaN(x)||isNaN(y)) return "";
  const n = Math.round((y-x)/86400000)+1;
  return n>0 ? n : "";
};
/* 자동 발번: 기존 최대 번호 +1 (i = 일괄 등록 시 증분) */
const autoNo = (coll, key, prefix, digits) => (i)=>{
  const nums = rows(coll).map(r=>parseInt(String(r[key]||"").replace(/\D/g,""),10)).filter(n=>!isNaN(n));
  const next = (nums.length?Math.max(...nums):0) + 1 + (i||0);
  return prefix + String(next).padStart(digits,"0");
};
/* 문서번호: PREFIX-YYMM-001 (당월 내 일련번호) */
const docNo = (coll, key, prefix) => (i)=>{
  const ym = todayStr.slice(2,4) + todayStr.slice(5,7);
  const head = `${prefix}-${ym}-`;
  const nums = rows(coll).filter(r=>String(r[key]||"").startsWith(head))
    .map(r=>parseInt(String(r[key]).slice(head.length),10)).filter(n=>!isNaN(n));
  return head + String((nums.length?Math.max(...nums):0) + 1 + (i||0)).padStart(3,"0");
};

/* 상태값 → 배지 색상 */
const BADGE = {
  "재직":"ok","휴직":"warn","퇴사":"neutral","수습":"info",

function split(total, weights){
  const out = weights.map(w=>Math.round(total*w/10000)*10000);
  out[out.length-1] += total - out.reduce((a,b)=>a+b,0);
  return out;
}

/* ============================================================
   app.js — 6pence 경영지원 HQ 프로토타입 엔진
   저장소: 브라우저 localStorage ("6pence.db.v1")
   ============================================================ */

const DB_KEY = "6pence.db.v3";
let DB = null;
let uidSeq = Date.now();
const uid = () => "r" + (uidSeq++).toString(36);

/* ---------------- store ---------------- */
function loadDB(){
  /* 이전 버전에 남아 있던 샘플 데이터 제거 */
  ["6pence.db.v1","6pence.db.v2"].forEach(k=>{ try{ localStorage.removeItem(k); }catch(e){} });
  try{
    const raw = localStorage.getItem(DB_KEY);
    if(raw){ DB = JSON.parse(raw); }
  }catch(e){ console.warn("DB 로드 실패, 초기화합니다.", e); }
  if(!DB || !DB.employees){
    /* 파일에 구워진 스냅샷이 있으면 그대로 복원한다 (다른 PC로 옮겨도 그대로) */
    if(typeof window !== "undefined" && window.__SNAPSHOT__ && window.__SNAPSHOT__.db){
      DB = window.__SNAPSHOT__.db;
      Object.keys(COLLECTIONS).forEach(k=>{ if(!DB[k]) DB[k] = []; });
      saveDB();
      return;
    }
    DB = emptyDB();
    /* 단독 데모 파일은 비어 있으면 시연용 데이터를 자동으로 채운다 */
    if(typeof DEMO_AUTOSEED !== "undefined" && DEMO_AUTOSEED){
      Object.keys(COLLECTIONS).forEach(k=>{ DB[k] = (SEED[k]||[]).map(withId); });
    }
    saveDB();
  }
  /* 스키마에 새 컬렉션이 추가된 경우 보정 */
  Object.keys(COLLECTIONS).forEach(k=>{ if(!DB[k]) DB[k] = []; });
}
function withId(r){ return Object.assign({_id:uid()}, r); }
function emptyDB(){
  const db = {};
  Object.keys(COLLECTIONS).forEach(k=>{ db[k] = []; });
  return db;
}

/* ---------------- utils ---------------- */
const esc = s => String(s==null?"":s).replace(/[&<>"']/g, m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
const won = n => (n===""||n==null||isNaN(n)) ? "-" : Number(n).toLocaleString("ko-KR");
function wonShort(n){
  n = Number(n)||0; const a = Math.abs(n);
  if(a>=100000000) return (n/100000000).toFixed(a>=1000000000?0:1).replace(/\.0$/,"")+"억";
  if(a>=10000) return Math.round(n/10000).toLocaleString("ko-KR")+"만";
  return n.toLocaleString("ko-KR");
}
const todayStr = (()=>{const t=new Date();return `${t.getFullYear()}-${String(t.getMonth()+1).padStart(2,"0")}-${String(t.getDate()).padStart(2,"0")}`;})();
function dayDiff(dateStr){
  if(!dateStr) return null;
  const a = new Date(dateStr+"T00:00:00"), b = new Date(todayStr+"T00:00:00");
  if(isNaN(a)) return null;
  return Math.round((a-b)/86400000);
}
function ddayText(dateStr){
  const n = dayDiff(dateStr);
  if(n===null) return "";
  if(n===0) return "D-DAY";
  return n>0 ? "D-"+n : "D+"+Math.abs(n);
}
const badgeClass = v => BADGE[v] || "";
const initial = name => (name||"?").trim().slice(-2);
function toast(msg){
  let w = document.querySelector(".toast-wrap");
  if(!w){ w = document.createElement("div"); w.className="toast-wrap"; document.body.appendChild(w); }
  const t = document.createElement("div"); t.className="toast"; t.innerHTML = `${icon("check","ic-sm")}${esc(msg)}`;
  w.appendChild(t); setTimeout(()=>t.remove(), 2200);
}

/* ---------------- 자동 계산 / 기본값 ---------------- */
function computeRow(col, rec){
  col.fields.forEach(f=>{
    if(!f.calc) return;
    const v = f.calc(rec);
    rec[f.k] = (v===""||v==null||(typeof v==="number"&&isNaN(v))) ? "" : v;
  });
  return rec;
}
function defaultsFor(id, i){
  const d = DEFAULTS[id] || {}, out = {};
  Object.keys(d).forEach(k=>{
    const v = d[k];
    out[k] = typeof v==="function" ? v(i||0)
           : v==="@today" ? todayStr
           : v==="@month" ? todayStr.slice(0,7)
           : v;
  });
  return out;
}
/* 금액 한글 표기: 264000000 → 2억 6,400만원 */
function koAmount(n){
  n = Number(n);
  if(!n || isNaN(n)) return "";
  const neg = n<0; n = Math.abs(n);
  const eok = Math.floor(n/100000000), man = Math.floor((n%100000000)/10000), rest = Math.round(n%10000);
  let s = "";
  if(eok) s += eok.toLocaleString("ko-KR")+"억 ";
  if(man) s += man.toLocaleString("ko-KR")+"만 ";
  if(rest) s += rest.toLocaleString("ko-KR");
  return (neg?"-":"") + s.trim() + "원";
}

/* ---------------- 셀 렌더 ---------------- */
function cell(f, v, rec){
  if(v===undefined || v===null || v==="") {
    if(f.t==="percent") v = 0; else return '<span class="muted">-</span>';
  }
  switch(f.t){
    case "month": return `${esc(v)}`;
    case "money": return won(v);
    case "num":   return Number(v).toLocaleString("ko-KR");
    case "percent":
      return `<div style="display:flex;align-items:center;gap:8px;min-width:110px">
        <div class="progress" style="flex:1"><i style="width:${Math.min(100,Number(v)||0)}%"></i></div>
        <b style="font-size:11.5px;width:32px;text-align:right">${Number(v)||0}%</b></div>`;
    case "person":
      return `<span class="person"><span class="avatar-sm">${esc(initial(v))}</span><b>${esc(v)}</b></span>`;
    case "date":{
      const dd = dayDiff(v);
      const near = dd!==null && dd>=0 && dd<=7;
      return `${esc(v)}${near?` <span class="muted" style="font-size:11px">(${ddayText(v)})</span>`:""}`;
    }
    default:
      if(f.badge || (f.t==="select" && BADGE[v])) return `<span class="badge ${badgeClass(v)}">${esc(v)}</span>`;
      return esc(v);
  }
}

   리스트(테이블) 뷰
   ============================================================ */
const PAGE_SIZES = [12, 30, 100];

function filterOptions(col){
  const f = col.fields.find(x=>x.k===col.stat);
  return (f && f.o) ? f.o : null;
}

function listData(id){
  const col = COLLECTIONS[id];
  let data = rows(id).slice();
  if(state.q){
    const q = state.q.toLowerCase();
    data = data.filter(r => col.fields.some(f => String(r[f.k]||"").toLowerCase().includes(q)));
  }
  if(state.filter === "__unset"){
    const f = col.fields.find(x=>x.k==="category");
    if(f) data = data.filter(r => !r[f.k]);
  }else if(state.filter && state.filter!=="전체" && col.stat){
    data = data.filter(r => String(r[col.stat]) === state.filter);
  }
  if(state.sort){
    const f = col.fields.find(x=>x.k===state.sort);
    data.sort((a,b)=>{
      let x=a[state.sort], y=b[state.sort];
      if(f && (f.t==="money"||f.t==="num"||f.t==="percent")){ x=Number(x)||0; y=Number(y)||0; return (x-y)*state.sortDir; }
      return String(x||"").localeCompare(String(y||""),"ko") * state.sortDir;
    });
  }
  return data;
}

function summaryCards(id, data){
  const col = COLLECTIONS[id];
  const cards = [];
  cards.push({l:"전체", v:rows(id).length + "건", accent:true});
  const opts = filterOptions(col);
  if(opts){
    opts.slice(0,3).forEach(o=>{
      const n = rows(id).filter(r=>r[col.stat]===o).length;
      cards.push({l:o, v:n + "건"});
    });
  }
  const moneyField = col.fields.find(f=>f.t==="money");
  if(moneyField){
    const sum = data.reduce((s,r)=>s+(Number(r[moneyField.k])||0),0);
    cards.push({l:`${moneyField.l} 합계 (현재 목록)`, v:wonShort(sum)+"원"});
  }
  const dateField = col.fields.find(f=>f.t==="date" && /만기|만료|마감|기한|갱신|예정/.test(f.l));
  if(dateField){
    const soon = rows(id).filter(r=>{const n=dayDiff(r[dateField.k]); return n!==null && n>=0 && n<=30;}).length;
    cards.push({l:`30일 내 ${dateField.l}`, v:soon + "건"});
  }
  return `<div class="stat-grid compact">${cards.map(c=>`
    <div class="stat ${c.accent?"accent":""}">
      <div class="stat-label">${esc(c.l)}</div>
      <div class="stat-value">${esc(c.v)}</div>
    </div>`).join("")}</div>`;
}

  document.getElementById("btn-csv").onclick = ()=>exportCSV(id, data);
  document.getElementById("btn-import").onclick = ()=>openImport(id);
  c.querySelectorAll("[data-daou]").forEach(b=>{
    b.onclick = ()=>daouAction(id, b.dataset.daou, sel);
  });

  /* 선택 항목 일괄 작업 */
  function bindBulk(){
    const on = (elId, fn) => { const b=document.getElementById(elId); if(b) b.onclick=fn; };
    on("bulk-clear", ()=>{ sel.clear(); syncSelection(); });
    const fieldSel = document.getElementById("bulk-field");
    if(fieldSel) fieldSel.onchange = ()=>{ state.bulkField = fieldSel.value; syncSelection(); };
    on("bulk-apply", ()=>{
      const key = (document.getElementById("bulk-field")||{}).value || col.stat;
      const v = document.getElementById("bulk-value").value;
      const f = col.fields.find(x=>x.k===key);
      let n=0; DB[id].forEach(r=>{ if(sel.has(r._id)){ r[key]=v; n++; } });
      commit(id); renderList();
      toast(`${n}건의 ${f?f.l:key}을(를) '${v}'(으)로 지정했습니다.`);
    });
    on("bulk-dup", ()=>{
      const copies = DB[id].filter(r=>sel.has(r._id)).map(r=>Object.assign({}, r, {_id:uid()}));
      DB[id] = copies.concat(DB[id]); commit(id); sel.clear(); state.page=1; renderNav(); renderList();
      toast(`${copies.length}건을 복제했습니다.`);
    });
    on("bulk-del", ()=>{
      if(!confirm(`선택한 ${sel.size}건을 삭제할까요?\n삭제 후에는 되돌릴 수 없습니다.`)) return;
      const n = sel.size;
      DB[id] = DB[id].filter(r=>!sel.has(r._id));
      sel.clear(); commit(id); renderNav(); renderList(); toast(`${n}건을 삭제했습니다.`);
    });
  }
  bindBulk();
}

/* 선택 항목 액션 바 */

    if(v===undefined || v==="") v = defs[f.k];

    let input;

    if(f.calc){
      input = `<input type="text" data-calc="${f.k}" value="${esc(fmtCalc(f, v))}" readonly tabindex="-1">`;
    } else if(f.t==="month"){
      const [yy, mm] = String(v||"").split("-");
      const thisY = +todayStr.slice(0,4);
      const years = Array.from({length:7},(_,i)=>thisY-4+i);
      input = `<div class="ym">
        <select data-ym="${f.k}" data-part="y">${years.map(y=>`<option value="${y}" ${String(y)===yy?"selected":""}>${y}년</option>`).join("")}</select>
        <select data-ym="${f.k}" data-part="m">${Array.from({length:12},(_,i)=>i+1).map(m=>`<option value="${String(m).padStart(2,"0")}" ${String(m).padStart(2,"0")===mm?"selected":""}>${m}월</option>`).join("")}</select>
        <input type="hidden" name="${f.k}" value="${esc(v)}">
      </div>`;
    } else if(f.t==="select"){
      input = `<select name="${f.k}"><option value="">선택</option>${(f.o||[]).map(o=>`<option ${String(v)===o?"selected":""}>${esc(o)}</option>`).join("")}</select>`;
    } else if(f.t==="textarea"){
      input = `<textarea name="${f.k}" placeholder="${esc(f.l)}을(를) 입력하세요">${esc(v)}</textarea>`;
    } else if(f.t==="date"){
      input = `<input type="date" name="${f.k}" value="${esc(v)}">`;
    } else if(f.t==="money"||f.t==="num"||f.t==="percent"){
      input = `<input type="number" name="${f.k}" value="${esc(v)}" placeholder="0" step="${f.t==="percent"?"0.1":"1"}">`;
    } else {
      const dl = f.t==="person" ? ' list="dl-emp"'
               : VENDOR_KEYS.has(f.k) ? ' list="dl-vendor"'
               : f.k==="dept" ? ' list="dl-dept"' : "";
      input = `<input type="text" name="${f.k}" value="${esc(v)}"${dl} placeholder="${esc(f.l)}"${f.t==="person"?' autocomplete="off"':""}>`;
    }

    return `<div class="form-row${full}">
      <label>${esc(f.l)} ${f.req?'<span class="req">*</span>':""}

  }).join("");

  modalEl = document.createElement("div");

      <h3>${clone?"복제해서 추가":(isNew?"새 항목 추가":"항목 수정")} <span class="muted" style="font-size:13px;font-weight:500">· ${esc(col.title)}</span></h3>

    <div class="modal-body"><form id="rec-form" autocomplete="off"><div class="form-grid">${body}</div></form>

      Object.entries(sync[fk]).forEach(([target, empKey])=>{

    col.fields.forEach(f=>{

  };

/* 계산 결과 표시 형식 */
function fmtCalc(f, v){
  if(v===""||v==null) return "";
  if(f.t==="money") return won(v)+"원";
  if(f.t==="percent") return v+"%";
  return String(v);
}

function removeRow(id, recId){
  const rec = rows(id).find(r=>r._id===recId);
  const label = rec ? (rec[COLLECTIONS[id].primary] || "이 항목") : "이 항목";
  if(!confirm(`"${label}" 항목을 삭제할까요?\n삭제 후에는 되돌릴 수 없습니다.`)) return;
  DB[id] = DB[id].filter(r=>r._id!==recId);
  commit(id); renderNav(); renderList(); toast("삭제되었습니다.");
}

/* ---------------- CSV 내보내기 ---------------- */
function csvOf(id, data){
  const col = COLLECTIONS[id];
  const q = v => { v = String(v==null?"":v).replace(/"/g,'""'); return /[",\n]/.test(v) ? `"${v}"` : v; };
  return [col.fields.map(f=>q(f.l)).join(",")]
    .concat(data.map(r=>col.fields.map(f=>q(r[f.k])).join(","))).join("\n");

function saveText(filename, text){

  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
}

   일괄 등록 — 엑셀 붙여넣기 / CSV 파일
   ============================================================ */

/* 구분자 자동 판별 CSV·TSV 파서 (따옴표 지원) */
function parseTable(text){
  text = String(text).replace(/^\ufeff/,"").replace(/\r\n?/g,"\n").trim();
  if(!text) return [];
  const head = text.split("\n")[0];
  const delim = (head.split("\t").length > head.split(",").length) ? "\t" : ",";
  const out = []; let row = [], cur = "", quoted = false;
  for(let i=0;i<text.length;i++){
    const ch = text[i];
    if(quoted){
      if(ch === '"'){ if(text[i+1] === '"'){ cur += '"'; i++; } else quoted = false; }
      else cur += ch;
    }
    else if(ch === '"') quoted = true;
    else if(ch === delim){ row.push(cur); cur = ""; }
    else if(ch === "\n"){ row.push(cur); out.push(row); row = []; cur = ""; }
    else cur += ch;
  }
  row.push(cur); out.push(row);
  return out.filter(r => r.some(c => String(c).trim() !== ""));
}

/* 머리글 → 필드 매핑 (항목명 또는 영문 키 모두 인식) */
function mapHeader(col, headRow){
  const norm = v => String(v==null?"":v).replace(/^\ufeff/,"").trim().toLowerCase().replace(/[\s·/()]/g,"");
  return headRow.map(h=>{
    const n = norm(h);
    return n ? (col.fields.find(f => norm(f.l)===n || norm(f.k)===n) || null) : null;
  });
}

/* 값 변환 + 검증 */
function coerce(f, raw){
  const v = String(raw==null?"":raw).trim();
  if(v === "") return {v:"", err:null};
  if(f.t==="money" || f.t==="num" || f.t==="percent"){
    const cleaned = v.replace(/[^0-9.\-]/g,"");          /* 1,234원 · ￦1234 등 허용 */
    const n = Number(cleaned);
    return (cleaned==="" || isNaN(n)) ? {v:"", err:"숫자 형식이 아님"} : {v:n, err:null};
  }
  /* 2026-08-20 · 2026.8.20 · 2026/8/20 · 20260820 · 2026년 8월 20일 모두 인식 */
  const dashed = v.replace(/[.\/년월일\s]/g,"-").replace(/-+/g,"-").replace(/^-|-$/g,"");
  if(f.t === "month"){
    const m = dashed.match(/^(\d{4})-?(\d{1,2})$/);
    return m ? {v:`${m[1]}-${String(m[2]).padStart(2,"0")}`, err:null} : {v:"", err:"월 형식이 아님 (2026-08)"};
  }
  if(f.t === "date"){
    const m = dashed.match(/^(\d{4})-?(\d{1,2})-?(\d{1,2})$/);
    return m ? {v:`${m[1]}-${String(m[2]).padStart(2,"0")}-${String(m[3]).padStart(2,"0")}`, err:null}
             : {v:"", err:"날짜 형식이 아님"};
  }
  if(f.t === "select" && f.o && !f.o.includes(v)){
    const hit = f.o.find(o => o.replace(/\s/g,"") === v.replace(/\s/g,""));
    return hit ? {v:hit, err:null} : {v, err:`허용값 아님 (${f.o.slice(0,4).join("/")}…)`};
  }
  return {v, err:null};
}

/* 붙여넣은 텍스트 → 검증된 행 목록 */
function analyze(id, text){
  const col = COLLECTIONS[id];
  const table = parseTable(text);
  if(!table.length) return {items:[], fields:[], ignored:[], error:null};
  if(table.length < 2) return {items:[], fields:[], ignored:[], error:"머리글 행과 데이터 행이 최소 1줄씩 필요합니다."};
  const map = mapHeader(col, table[0]);
  const fields = map.filter(Boolean);
  if(!fields.length) return {items:[], fields:[], ignored:[], error:"머리글에서 인식할 수 있는 항목이 없습니다. CSV 내보내기의 머리글을 그대로 사용해 주세요."};
  const ignored = table[0].filter((h,i)=>!map[i] && String(h).trim()!=="");
  const calcFields = col.fields.filter(f=>f.calc && !fields.includes(f));
  const items = table.slice(1).map((r,ri)=>{
    const rec = {}, errs = {};
    map.forEach((f,ci)=>{
      if(!f) return;
      const {v, err} = coerce(f, r[ci]);
      rec[f.k] = v;
      if(err) errs[f.k] = err;
    });
    /* 비어 있는 자동 발번 항목 채우기 (문서번호·사번·자산번호) */
    const auto = DEFAULTS[id] || {};
    Object.keys(auto).forEach(k=>{
      if(typeof auto[k]==="function" && (rec[k]===""||rec[k]==null)) rec[k] = auto[k](ri);
    });
    computeRow(col, rec);                      /* 자동 계산 항목 채우기 */
    col.fields.forEach(f=>{ if(f.req && (rec[f.k]===""||rec[f.k]==null) && !errs[f.k]) errs[f.k] = "필수 항목"; });
    return {n:ri+1, rec, errs, ok:Object.keys(errs).length===0};
  });
  return {items, fields:fields.concat(calcFields), ignored, error:null};
}

}

/* ============================================================
   월 마감 — 매출·비용 원장을 월별 손익으로 집계
   ============================================================ */
const CLOSE_SOURCES = [
  {k:"revenue", coll:"revenue", label:"매출·입금", field:"amount", kind:"rev", fixed:true,
   desc:"매출일 기준 공급가액 합계", pick:r=>true},
  {k:"cost", coll:"cost", label:"비용 관리", field:"amount", kind:"opex",
   desc:"귀속월 기준 비용 합계", pick:r=>true},
  {k:"expense", coll:"expense", label:"지출결의", field:"amount", kind:"opex",
   desc:"승인·완료 건만 집계", pick:r=>r.status==="승인"||r.status==="완료"},
  {k:"corpcard", coll:"corpcard", label:"법인카드", field:"amount", kind:"opex",
   desc:"증빙 반려 건 제외", pick:r=>r.receipt!=="반려"}
];

function cfg(){
  if(!DB._cfg) DB._cfg = {autoSync:true, use:{cost:true, expense:false, corpcard:false}};
  if(!DB._cfg.use) DB._cfg.use = {cost:true, expense:false, corpcard:false};
  return DB._cfg;
}
const ymOf = v => String(v||"").slice(0,7);
function srcRows(src, ym){
  const key = src.coll==="cost" ? "month" : (src.coll==="invoice" ? "issueDate" : (src.coll==="expense"||src.coll==="corpcard"||src.coll==="revenue" ? "date" : "date"));
  return rows(src.coll).filter(r => ymOf(r[key])===ym && src.pick(r));
}
/* 한 달 집계 */
function rollup(ym){
  const c = cfg(), parts = {}, counts = {};
  let revenue = 0, opex = 0;
  CLOSE_SOURCES.forEach(src=>{
    const list = srcRows(src, ym);
    const sum = list.reduce((a,r)=>a+(Number(r[src.field])||0),0);
    const on = src.fixed || c.use[src.k];
    parts[src.k] = {sum, on, count:list.length};
    counts[src.k] = list.length;
    if(!on) return;
    if(src.kind==="rev") revenue += sum; else opex += sum;
  });
  return {ym, revenue, opex, parts};
}
/* 원장 데이터가 있는 월 목록 */
function sourceMonths(){
  const set = new Set();
  CLOSE_SOURCES.forEach(src=>{
    const key = src.coll==="cost" ? "month" : "date";
    rows(src.coll).forEach(r=>{ const m = ymOf(r[key]); if(m.length===7) set.add(m); });
  });
  return [...set].sort();
}
/* 집계 결과를 월별 손익에 반영 (매출원가는 수동 유지) */
function applyClosing(ym){
  const r = rollup(ym);
  let row = DB.pnl.find(x=>x.month===ym);
  if(!row){
    row = {_id:uid(), month:ym, revenue:0, cogs:"", opex:0, note:""};
    DB.pnl.unshift(row);
  }
  row.revenue = r.revenue;
  row.opex = r.opex;
  row.linked = "자동";
  computeRow(COLLECTIONS.pnl, row);
  return r;
}
/* 원장이 바뀌면 관련 월을 다시 집계 */
function autoRollup(changedId){
  if(!cfg().autoSync) return 0;
  if(!CLOSE_SOURCES.some(s=>s.coll===changedId)) return 0;
  const months = new Set(sourceMonths());
  rows("pnl").forEach(r=>{ if(r.linked==="자동" && r.month) months.add(r.month); });
  months.forEach(applyClosing);
  return months.size;
}
/* 모든 변경의 저장 지점 — 저장 + 마감 연동 */
function commit(id){
  autoRollup(id);
  saveDB();
}
/* 반영값과 집계값이 다른 월 (재반영 필요) */
function closingDiff(ym){
  const r = rollup(ym);
  const row = DB.pnl.find(x=>x.month===ym);
  if(!row) return {r, row:null, stale:true};
  return {r, row, stale: Number(row.revenue||0)!==r.revenue || Number(row.opex||0)!==r.opex};
}
/* 월별 손익을 월 순서로 정렬 (그래프 공통) */
function pnlSeries(n){
  return rows("pnl").slice()
    .sort((a,b)=>String(a.month).localeCompare(String(b.month)))
    .slice(n?-n:0);
}

/* ============================================================
   리스크 레이더 — 회사 데이터를 훑어 '지금 조치가 필요한 것'을 뽑는다
   규칙은 경영지원 실무 기준. 데이터가 없으면 조용히 건너뛴다.
   ============================================================ */
function riskScan(){
  const out = [];
  const push = (level, title, items, go, note) => {
    if(!items.length) return;
    out.push({level, title, count:items.length, go, note,
              sample:items.slice(0,3), amount:items.reduce((s,i)=>s+(Number(i._amt)||0),0)});
  };
  const dd = v => dayDiff(v);
  const overdue = (v) => { const n = dd(v); return n!==null && n < 0; };
  const within = (v, days) => { const n = dd(v); return n!==null && n >= 0 && n <= days; };

  /* 기한 초과 — 가장 급한 것 */
  push("high", "기한이 지난 마감",
    rows("deadlines").filter(r=>r.status!=="완료" && overdue(r.dueDate))
      .map(r=>({label:`${r.title} · ${r.owner||"담당 미지정"}`, sub:`${r.dueDate} (${ddayText(r.dueDate)})`})),
    "deadlines", "지연되면 가산세·과태료로 이어질 수 있습니다");

  push("high", "만료된 계약",
    rows("contracts").filter(r=>r.status!=="해지" && overdue(r.endDate))
      .map(r=>({label:`${r.title} · ${r.party||""}`, sub:`${r.endDate} 만료`, _amt:r.amount})),
    "contracts", "무계약 상태로 거래가 진행 중일 수 있습니다");

  push("high", "만료된 인증·허가",
    rows("certification").filter(r=>overdue(r.expiryDate))
      .map(r=>({label:r.name, sub:`${r.expiryDate} 만료 · ${r.agency||""}`})),
    "certification", "입찰·납품 자격에 직접 영향을 줍니다");

  /* 임박 */
  push("mid", "30일 내 만료되는 계약",
    rows("contracts").filter(r=>r.status!=="해지" && within(r.endDate,30))
      .map(r=>({label:`${r.title} · ${r.party||""}`, sub:`${r.endDate} (${ddayText(r.endDate)})`, _amt:r.amount})),
    "contracts", "갱신 여부를 미리 정해야 합니다");

  push("mid", "30일 내 만기되는 보험",
    rows("insurance").filter(r=>within(r.endDate,30))
      .map(r=>({label:`${r.name} · ${r.insurer||""}`, sub:`${r.endDate} 만기`, _amt:r.premium})),
    "insurance");

  push("mid", "이번 주 세무 일정",
    rows("tax").filter(r=>r.status!=="완료" && within(r.dueDate,7))
      .map(r=>({label:`${r.kind} · ${r.period||""}`, sub:`${r.dueDate} (${ddayText(r.dueDate)})`, _amt:r.amount})),
    "tax", "신고·납부 기한입니다");

  /* 돈 */
  const unpaid = rows("revenue").filter(r=>r.status!=="입금완료" && r.dueDate && overdue(r.dueDate));
  push("high", "입금예정일이 지난 매출",
    unpaid.map(r=>({label:`${r.client} · ${r.item||""}`, sub:`${r.dueDate} 예정 (${ddayText(r.dueDate)})`,
                    _amt:(Number(r.amount)||0)+(Number(r.vat)||0)})),
    "revenue", "회수 독촉이 필요한 건입니다");

  push("mid", "증빙이 없는 법인카드 사용",
    rows("corpcard").filter(r=>r.receipt!=="완료")
      .map(r=>({label:`${r.merchant} · ${r.holder||""}`, sub:`${r.date} · ${won(r.amount)}원`, _amt:r.amount})),
    "corpcard", "부가세 매입공제를 못 받을 수 있습니다");

  push("mid", "계정과목이 지정되지 않은 카드내역",
    rows("corpcard").filter(r=>!r.category)
      .map(r=>({label:`${r.merchant}`, sub:`${r.date} · ${won(r.amount)}원`, _amt:r.amount})),
    "corpcard", "월 마감 비용 집계에서 누락됩니다");

  /* 결재 */
  push("mid", "3일 넘게 대기 중인 지출결의",
    rows("expense").filter(r=>r.status==="결재대기" && (dd(r.date)===null || dd(r.date) < -3))
      .map(r=>({label:`${r.item} · ${r.requester||""}`, sub:`${r.date} 기안 · ${won(r.amount)}원`, _amt:r.amount})),
    "expense");

  push("mid", "승인 대기 중인 휴가 신청",
    rows("attendance").filter(r=>r.status==="신청")
      .map(r=>({label:`${r.name} · ${r.kind}`, sub:`${r.startDate}${r.endDate&&r.endDate!==r.startDate?` ~ ${r.endDate}`:""}`})),
    "attendance");

  /* 자산·연동 */
  push("mid", "분실·수리 중인 자산",
    rows("assets").filter(r=>r.status==="분실"||r.status==="수리중")
      .map(r=>({label:`${r.name} · ${r.user||"미지정"}`, sub:`${r.status} · ${r.assetNo||""}`, _amt:r.price})),
    "assets");

  const noEmpNo = rows("employees").filter(e=>e.status!=="퇴사" && (!e.empNo || /^EMP-/.test(e.empNo)));
  if(DAOU.configured) push("low", "다우오피스 사번이 없는 임직원",
    noEmpNo.map(e=>({label:e.name, sub:e.email||""})),
    "employees", "사번이 있어야 근태 전송·알림 발송이 동작합니다");

  const order = {high:0, mid:1, low:2};
  return out.sort((a,b)=>order[a.level]-order[b.level] || b.count-a.count);
}

function riskSection(){
  const list = riskScan();
  const high = list.filter(r=>r.level==="high").reduce((s,r)=>s+r.count,0);
  const total = list.reduce((s,r)=>s+r.count,0);
  if(!total){
    return `<div class="risk-wrap ok">
      <div class="risk-head">${icon("check","ic-lg")}
        <div><div class="risk-title">지금 조치가 필요한 항목이 없습니다</div>
        <div class="risk-sub">계약·보험·인증 만기, 세무 기한, 미수금, 증빙 누락을 자동으로 감시하고 있습니다</div></div>
      </div></div>`;
  }
  return `<div class="risk-wrap">
    <div class="risk-head">
      ${icon("alert","ic-lg")}
      <div>
        <div class="risk-title">지금 조치가 필요한 <b>${total}건</b>${high?` · 급한 것 <b class="hi">${high}건</b>`:""}</div>
        <div class="risk-sub">계약·보험·인증 만기, 세무 기한, 미수금, 증빙 누락을 자동으로 점검했습니다</div>
      </div>
      <a class="btn btn-sm" href="#/brief" style="margin-left:auto">${icon("file","ic-sm")} 경영 브리핑</a>
    </div>
    <div class="risk-grid">
      ${list.map(r=>`
        <a class="risk-card ${r.level}" href="#/${r.go}">
          <div class="risk-card-top">
            <span class="risk-badge ${r.level}">${r.level==="high"?"급함":r.level==="mid"?"확인":"참고"}</span>
            <b class="risk-count">${r.count}건</b>
          </div>
          <div class="risk-card-title">${esc(r.title)}</div>
          ${r.amount ? `<div class="risk-amount">${wonShort(r.amount)}원</div>` : ""}
          <div class="risk-sample">${r.sample.map(i=>`<div class="rs"><span>${esc(i.label)}</span><em>${esc(i.sub||"")}</em></div>`).join("")}
            ${r.count>3?`<div class="rs more">외 ${r.count-3}건</div>`:""}</div>
          ${r.note?`<div class="risk-note">${esc(r.note)}</div>`:""}
        </a>`).join("")}
    </div>
  </div>`;
}

const PALETTE = ["#e8734f","#f2946f","#f7b79b","#fad0bd","#c9b8ae","#a8938a","#8d766c"];

function viewDashboard(){
  const emp = rows("employees");
  const active = emp.filter(e=>e.status!=="퇴사");
  const thisMonth = todayStr.slice(0,7);

  const joinedThisMonth = rows("onboarding").filter(r=>r.kind==="입사" && String(r.date).slice(0,7)===thisMonth).length;
  const leftThisMonth  = rows("onboarding").filter(r=>r.kind==="퇴사" && String(r.date).slice(0,7)===thisMonth).length;
  const openJobs = rows("recruiting").filter(r=>r.status==="진행중");
  const applicants = openJobs.reduce((s,r)=>s+(Number(r.applicants)||0),0);

  const pendingExp = rows("expense").filter(r=>r.status==="결재대기");
  const pendingLeave = rows("attendance").filter(r=>r.status==="신청");
  const pendingSeal = rows("seal").filter(r=>r.status==="신청");
  const pendingAll = pendingExp.length + pendingLeave.length + pendingSeal.length;

  const expMonth = rows("expense").filter(r=>String(r.date).slice(0,7)===thisMonth)
    .reduce((s,r)=>s+(Number(r.amount)||0),0);

function bindDashboard(){
  document.querySelectorAll("[data-q]").forEach(b=>b.onclick=()=>{
    const q = b.dataset.q;
    if(q === "approval"){
      if(!(DAOU.have||{}).formCode && DAOU.configured) return showSetup("approval");
      if(!DAOU.configured) return alert("먼저 데이터 관리 화면에서 다우오피스에 연결하세요.");
      return openApprovalDraft();
    }
    if(q === "expense")  return openForm("expense", null);
    if(q === "leave")    return openForm("attendance", null);
    if(q === "import"){
      const pick = prompt("일괄 등록할 화면을 고르세요.\n\n1 법인카드   2 지출결의   3 매출/입금\n4 비용 관리  5 근태/휴가  6 임직원", "1");
      const map = {1:"corpcard",2:"expense",3:"revenue",4:"cost",5:"attendance",6:"employees"};
      const id = map[Number(pick)];
      if(!id) return;
      location.hash = "#/" + id;
      setTimeout(()=>openImport(id), 120);
    }
  });
}

/* ---------------- 전자결재 상신 ----------------
   6pence 지출결의로 남기고, 동시에 다우오피스 기안 화면을 엽니다. */
function openApprovalDraft(){
  const col = COLLECTIONS.expense;
  const cat = col.fields.find(f=>f.k==="category").o;
  const me = rows("employees");
  const defs = defaultsFor("expense", 0);

  modalEl = document.createElement("div");
  modalEl.className = "overlay";
  modalEl.innerHTML = `<div class="modal">
    <div class="modal-head"><div>
      <h3>전자결재 상신</h3>
      <div class="sub">작성하면 6pence 지출결의에 기록되고, 다우오피스 기안 화면이 열립니다</div></div></div>
    <div class="modal-body"><form id="ap-form"><div class="form-grid">
      <div class="form-row full">
        <label>지출내용 <span class="req">*</span></label>
        <input name="item" placeholder="예: 8월 캠페인 콘텐츠 제작비" autocomplete="off">
      </div>
      <div class="form-row">
        <label>금액 <span class="req">*</span><span class="form-hint" style="float:right">원</span></label>
        <input name="amount" type="number" placeholder="0">
        <div class="money-echo" data-echo="amount"></div>
      </div>
      <div class="form-row">
        <label>계정과목</label>
        <select name="category"><option value="">선택</option>${cat.map(o=>`<option>${esc(o)}</option>`).join("")}</select>
      </div>
      <div class="form-row">
        <label>기안자 <span class="req">*</span></label>
        <input name="requester" list="dl-emp" autocomplete="off" placeholder="이름">
      </div>
      <div class="form-row">
        <label>기안일</label>
        <input name="date" type="date" value="${esc(defs.date||todayStr)}">
      </div>
      <div class="form-row full">
        <label>비고</label>
        <textarea name="note" placeholder="결재 본문에 함께 들어갑니다"></textarea>
      </div>
    </div></form>
    <datalist id="dl-emp">${me.map(e=>`<option value="${esc(e.name)}">`).join("")}</datalist>
    <div class="note" style="margin-top:14px">${icon("info","ic-sm")}
      <div>다우오피스 기안 화면이 <b>새 창</b>으로 열립니다. 결재선을 지정하고 상신하시면 됩니다.</div></div>
    </div>
    <div class="modal-foot">
      <button class="btn" id="ap-cancel">취소</button>
      <button class="btn btn-primary" id="ap-go">${icon("upload","ic-sm")} 작성하고 다우오피스로</button>
    </div></div>`;
  document.body.appendChild(modalEl);
  document.body.style.overflow = "hidden";
  modalEl.onclick = e => { if(e.target===modalEl) closeModal(); };
  modalEl.querySelector("#ap-cancel").onclick = closeModal;

  const form = modalEl.querySelector("#ap-form");
  form.addEventListener("input", ()=>{
    const e = form.querySelector('[data-echo="amount"]');
    if(e) e.textContent = koAmount(form.amount.value);
  });

  modalEl.querySelector("#ap-go").onclick = ()=>{
    const v = k => (form[k] ? String(form[k].value).trim() : "");
    if(!v("item") || !v("amount") || !v("requester")){
      alert("지출내용 · 금액 · 기안자는 필수입니다."); return;
    }
    const emp = rows("employees").find(e=>e.name===v("requester")) || {};
    const rec = Object.assign({_id:uid()}, defs, {
      date: v("date") || todayStr,
      requester: v("requester"),
      dept: emp.dept || "",
      item: v("item"),
      category: v("category"),
      amount: Number(v("amount")) || 0,
      status: "결재대기",
    });
    DB.expense.unshift(rec);
    commit("expense");

    const content = `<table border="1" cellpadding="6" style="border-collapse:collapse">
      <tr><th>문서번호</th><td>${esc(rec.docNo||"")}</td><th>기안일</th><td>${esc(rec.date)}</td></tr>
      <tr><th>기안자</th><td>${esc(rec.requester)}</td><th>부서</th><td>${esc(rec.dept)}</td></tr>
      <tr><th>계정과목</th><td>${esc(rec.category)}</td><th>금액</th><td>${won(rec.amount)}원</td></tr>

    </table>`;
    approvalSubmitDirect({title:`[지출결의] ${rec.item} (${won(rec.amount)}원)`,
      content, draftEmpNo:empNoOf(rec.requester), partnerDocId:rec.docNo || rec._id});

    toast("지출결의로 기록하고 다우오피스 기안 화면을 열었습니다.");
  };
  form.querySelector('[name="item"]').focus();
}

function viewClosing(){
  const c = cfg();
  const months = sourceMonths();
  if(!state.closeYm || !months.includes(state.closeYm))
    state.closeYm = months.includes(todayStr.slice(0,7)) ? todayStr.slice(0,7) : (months[months.length-1] || todayStr.slice(0,7));
  const ym = state.closeYm;
  const {r, row, stale} = closingDiff(ym);
  const cogs = row && has(row.cogs) ? N(row.cogs) : 0;
  const profit = r.revenue - cogs - r.opex;
  const margin = r.revenue ? round1(profit/r.revenue*100) : 0;
  const opexMax = Math.max(...CLOSE_SOURCES.filter(s=>s.kind==="opex").map(s=>r.parts[s.k].sum), 1);
  const [yy, mm] = ym.split("-");
  const thisY = +todayStr.slice(0,4);

  return `
  <div class="page-head">
    <div>
      <div class="eyebrow">재무 Finance</div>
      <h1 class="page-title">월 마감</h1>

function bindClosing(){
  const setYm = ()=>{
    state.closeYm = document.getElementById("close-y").value + "-" + document.getElementById("close-m").value;
    renderClosing();
  };
  document.getElementById("close-y").onchange = setYm;
  document.getElementById("close-m").onchange = setYm;
  document.querySelectorAll("[data-src]").forEach(b=>b.onchange=()=>{
    cfg().use[b.dataset.src] = b.checked;
    if(cfg().autoSync) sourceMonths().forEach(applyClosing);
    saveDB(); renderClosing();
    toast(`${CLOSE_SOURCES.find(s=>s.k===b.dataset.src).label}을(를) 집계에서 ${b.checked?"포함":"제외"}했습니다.`);
  });
  document.getElementById("auto-sync").onchange = e=>{
    cfg().autoSync = e.target.checked;
    if(e.target.checked) sourceMonths().forEach(applyClosing);
    saveDB(); renderClosing();
    toast(e.target.checked ? "자동 연동을 켰습니다. 원장 변경이 손익에 바로 반영됩니다." : "자동 연동을 껐습니다.");
  };
  document.getElementById("apply-close").onclick = ()=>{
    applyClosing(state.closeYm); saveDB(); renderClosing();
    toast(`${state.closeYm} 손익에 반영했습니다.`);
  };
  document.getElementById("apply-all").onclick = ()=>{
    const ms = sourceMonths(); ms.forEach(applyClosing); saveDB(); renderClosing();
    toast(`${ms.length}개 월을 재집계했습니다.`);
  };
  document.querySelectorAll("[data-close]").forEach(b=>b.onclick=()=>{
    applyClosing(b.dataset.close); saveDB(); renderClosing();
    toast(`${b.dataset.close} 손익에 반영했습니다.`);
  });
}
function renderClosing(){
  document.getElementById("content").innerHTML = viewClosing();
  bindClosing();
}

function globalSearch(q){
  const box = document.getElementById("search-result");
  if(!q || q.length<1){ box.style.display="none"; return; }
  const ql = q.toLowerCase();
  const hits = [];
  Object.keys(COLLECTIONS).forEach(id=>{
    const col = COLLECTIONS[id];
    rows(id).forEach(r=>{
      if(hits.length>=12) return;
      const match = col.fields.some(f=>String(r[f.k]||"").toLowerCase().includes(ql));
      if(match) hits.push({id, title:r[col.primary]||"(제목 없음)", col:col.title});
    });
  });
  Object.keys(DOCS).forEach(id=>{
    if(DOCS[id].title.toLowerCase().includes(ql)) hits.push({id, title:DOCS[id].title, col:"회사 문서/규정"});
  });
  box.innerHTML = hits.length ? hits.slice(0,10).map(h=>`
    <a class="list-row" href="#/${h.id}" style="padding:10px 16px">
      <div class="list-main"><div class="t">${esc(h.title)}</div><div class="s">${esc(h.col)}</div></div>
      ${icon("chev","ic-sm")}
    </a>`).join("") : `<div class="empty" style="padding:24px">검색 결과가 없습니다.</div>`;
  box.style.display="block";
}

/* ---------------- 지금 상태 그대로 파일 만들기 ----------------
   현재 데이터를 HTML 안에 심어서 단일 파일로 내보냅니다.
   다른 PC에서 그 파일을 열면 지금 화면이 그대로 재현됩니다. */
function exportSnapshot(){
  toast("파일을 만드는 중…");
  try{
    /* 지금 열려 있는 문서 자체가 템플릿입니다. 서버가 필요 없습니다. */
    const doc = document.documentElement.cloneNode(true);

    /* 화면에 그려진 내용과 이전 스냅샷은 걷어낸다 — 열릴 때 다시 그려집니다 */
    doc.querySelectorAll(".toast-wrap, .overlay").forEach(n=>n.remove());
    /* 이전에 심어 둔 스냅샷·인증키 조각만 걷어낸다.
       본체 스크립트도 __SNAPSHOT__ 을 "읽는" 코드를 갖고 있으므로
       내용 검색이 아니라 "그 값을 대입하는 첫 줄"인지로 가려낸다. */
    doc.querySelectorAll("script").forEach(n=>{
      if(n.hasAttribute("data-6pence-inject")) { n.remove(); return; }
      if(/^\s*window\.(__SNAPSHOT__|__DAOU_DIRECT__)\s*=/.test(n.textContent || "")) n.remove();
    });
    ["content","nav","search-result"].forEach(elId=>{
      const n = doc.querySelector("#" + elId);
      if(n) n.innerHTML = "";
    });

    /* 인증키는 파일에 담지 않는다 */
    const clean = {};
    Object.keys(DB).forEach(k=>{ if(k !== "_daou") clean[k] = DB[k]; });

    const snap = JSON.stringify({db: clean, at: new Date().toISOString()})
                    .replace(/<\//g, "<\\/");        /* 스크립트 태그 조기 종료 방지 */
    const tag = doc.querySelector("script");
    const inject = document.createElement("script");
    inject.setAttribute("data-6pence-inject", "1");
    inject.textContent = `window.__SNAPSHOT__ = ${snap};`;
    tag ? tag.parentNode.insertBefore(inject, tag) : doc.querySelector("body").appendChild(inject);

    const html = "<!doctype html>\n" + doc.outerHTML;
    const blob = new Blob([html], {type:"text/html;charset=utf-8"});
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = `6pence_${todayStr}.html`;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(a.href), 4000);
    const n = Object.keys(COLLECTIONS).reduce((s2,k)=>s2+rows(k).length,0);
    toast(`${n}건을 담은 파일을 저장했습니다. (인증키는 빠집니다)`);
  }catch(e){
    alert("파일을 만들지 못했습니다.\n\n" + (e.message || e));
  }
}


/* ============================================================
   다우오피스 직접 연동 모드
   서버(프록시) 없이 브라우저가 api.daouoffice.com 을 직접 호출합니다.
   다우오피스가 Access-Control-Allow-Origin: * 를 주기 때문에 가능합니다.
   ※ 이 모드로 빌드된 파일에는 인증키가 들어 있습니다. 사외 유출 금지.
   ============================================================ */
let DIRECT = null;
function resolveDirect(){
  const embedded = (typeof window !== "undefined" && window.__DAOU_DIRECT__) || null;
  const saved = (DB && DB._daou && DB._daou.clientId) ? DB._daou : null;
  DIRECT = embedded || saved || null;
  return DIRECT;
}

function daouDirect(path, extra, method){
  const body = Object.assign({
    clientId: DIRECT.clientId, clientSecret: DIRECT.clientSecret,
    productName: "6pence HQ", productVersion: "0.1"
  }, extra || {});
  return fetch(DAOU_URL + path, {
    method: method || "POST",
    headers: {"Content-Type": "application/json; charset=UTF-8"},
    body: JSON.stringify(body)
  }).then(r=>r.json()).then(j=>{
    if(String(j.code) !== "200") throw new Error(`[${j.code}] ${j.message || ""} ${j.messageDetail || ""}`.trim());
    return j.data;
  });
}

/* 계정 + 부서원을 합쳐 임직원 명부 (서버판 fetch_employees 와 동일한 규칙) */
function fetchEmployeesDirect(){
  const STATUS = {NORMAL:"재직", ONLINE:"재직", STOP:"퇴사", DORMANT:"휴직"};
  return Promise.all([
    daouDirect("/public/v1/account"),
    daouDirect("/public/v1/dept/member").catch(()=>[])
  ]).then(([accounts, members])=>{
    const byLogin = {};
    (members||[]).forEach(m=>{ if(m && m.loginId) byLogin[m.loginId] = m; });
    return (accounts||[]).map(a=>{
      const m = byLogin[a.loginId] || {};
      return {
        empNo:    String(a.employeeNumber || m.employeeNumber || ""),
        name:     a.koName || m.userName || "",
        dept:     m.orgName || "",
        position: a.positionName || a.gradeName || m.dutyName || "",
        type:     "정규직",
        joinDate: "",
        email:    a.email || "",
        phone:    a.mobileNo || a.directTel || "",
        status:   STATUS[String(a.status||"").toUpperCase()] || "재직",
      };
    });
  });
}

/* ---------------- 부서 조회 (/public/v1/dept) ----------------
   다우오피스 조직도를 그대로 받아 6pence 부서 선택지에 반영합니다.
   · 계층(상위부서)까지 받아 경로를 만들어 둡니다
   · 부서명 목록은 DEPTS 배열을 제자리에서 갱신해 모든 선택 상자에 즉시 반영됩니다
------------------------------------------------------------- */
function fetchDeptsDirect(){
  return daouDirect("/public/v1/dept").then(list=>{
    const raw = (list||[]).map(d=>({
      id:       String(d.id != null ? d.id : (d.deptId != null ? d.deptId : "")),
      parentId: String(d.parentId != null ? d.parentId : (d.parentDeptId != null ? d.parentDeptId : "")),
      name:     d.name || d.deptName || d.orgName || "",
      code:     d.code || d.deptCode || "",
      order:    Number(d.sortOrder != null ? d.sortOrder : (d.order || 0)) || 0
    })).filter(d=>d.name);

    /* 상위부서를 따라 올라가며 "본부 > 팀" 경로를 만든다 (순환 방지 8단계) */
    const byId = {};
    raw.forEach(d=>{ if(d.id) byId[d.id] = d; });
    raw.forEach(d=>{
      const names = [d.name];
      let cur = d, depth = 0;
      while(cur.parentId && byId[cur.parentId] && depth++ < 8){
        cur = byId[cur.parentId];
        names.unshift(cur.name);
      }
      d.path  = names.join(" > ");
      d.depth = names.length - 1;
    });
    raw.sort((a,b)=> a.path < b.path ? -1 : a.path > b.path ? 1 : 0);
    return raw;
  });
}

/* 받아온 부서를 저장하고, 부서 선택 상자의 선택지를 교체한다 */
function mergeDepts(list){
  if(!list || !list.length) return {total:0, changed:false};
  const before = DEPTS.join("|");
  const names = [];
  list.forEach(d=>{ if(d.name && names.indexOf(d.name) < 0) names.push(d.name); });

  /* 이미 데이터에 쓰이고 있는 부서명은 선택지에서 빼지 않는다 (기존 값 보존) */
  const inUse = {};
  ["employees","onboarding","attendance","evaluation","expense","assets","owners"].forEach(id=>{
    rows(id).forEach(r=>{ if(r.dept) inUse[r.dept] = 1; });
  });
  Object.keys(inUse).forEach(n=>{ if(names.indexOf(n) < 0) names.push(n); });

  DEPTS.length = 0;                    /* 배열을 제자리에서 갈아끼워야 */
  names.forEach(n=>DEPTS.push(n));     /* COLLECTIONS 의 o:DEPTS 참조가 함께 바뀐다 */

  DB._depts = list;
  return {total:list.length, changed: DEPTS.join("|") !== before};
}

function deptTree(){ return (DB && DB._depts) || []; }

/* 전자결재 기안 — 브라우저가 다우오피스로 직접 폼 전송 */

  f.action = DAOU_URL + "/public/v4/approval/document" + (DIRECT.approvalPopup === false ? "" : "/popup");
