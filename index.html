/* ---------------- Works 연동 (/public/v1/works) ----------------
   다우오피스 Works 로 업무 항목을 밀어 넣습니다.
   Works 관리 > 외부 데이터 가져오기에서 발급한 토큰이 있어야 동작합니다.
   파라미터명(제목/담당자/기한 …)은 회사마다 다르므로 매핑을 바꿀 수 있게 열어 둡니다.
--------------------------------------------------------------- */
const WORKS_FIELDS = {
  title:    "title",
  owner:    "worker",
  dueDate:  "dueDate",
  status:   "status",
  note:     "content"
};

function worksParams(id, r){
  const m = NOTI_MAP[id] || {};
  const F = (DIRECT && DIRECT.worksFields) || WORKS_FIELDS;
  const out = {};
  out[F.title]   = String(r[m.title] || r.title || r.name || "");
  out[F.owner]   = String(r[m.owner] || "");
  out[F.dueDate] = String(r[m.due]   || "");
  out[F.status]  = String(r.status || "");
  out[F.note]    = `6pence · ${COLLECTIONS[id].title}`;
  return out;
}

/* Works 는 항목을 한 건씩 받습니다. 순차로 보내고 성공/실패를 모아 돌려줍니다. */
function worksPushDirect(id, picked){
  let ok = 0;
  const fails = [];
  return picked.reduce((chain, r)=>chain.then(()=>
    daouDirect("/public/v1/works", {token: DIRECT.worksToken || "", params: worksParams(id, r)})
      .then(()=>{ ok++; })
      .catch(e=>{ fails.push(`${r.title || r.name || r._id}: ${e.message || e}`); })
  ), Promise.resolve()).then(()=>({ok, fails}));
}

/* ---------------- 자동 최신화 ----------------
   사이트를 열면 다우오피스 임직원 정보를 조용히 반영합니다.
   · 6pence에서만 관리하는 항목(입사일·고용형태·비고)은 덮어쓰지 않습니다
   · 다우오피스가 원본인 항목(이름·부서·직위·연락처·상태)만 갱신합니다
   · 다우오피스에서 사라진 사람은 지우지 않고 그대로 둡니다 (수동 확인용)
------------------------------------------------ */
const DAOU_OWNED = ["name","dept","position","email","phone","status"];
const norm = v => String(v == null ? "" : v).trim().toLowerCase();

/* 같은 사람인지 판단하는 순서: 사번 → 이메일 → 이름
   이메일만 보면 6pence에 이미 있던 사람과 다우오피스 계정이 따로 쌓입니다.
   (사내 메일과 다우오피스 계정 메일이 다른 경우가 흔합니다) */
function empIndex(){
  const byNo = {}, byMail = {}, byName = {};
  DB.employees.forEach(e=>{
    const no = norm(e.empNo);
    if(no && !/^emp-/.test(no)) byNo[no] = e;
    if(norm(e.email)) byMail[norm(e.email)] = e;
    if(norm(e.name))  byName[norm(e.name)]  = e;
  });
  return {byNo, byMail, byName};
}
function findEmp(ix, r){
  const no = norm(r.empNo);
  if(no && ix.byNo[no]) return ix.byNo[no];
  if(norm(r.email) && ix.byMail[norm(r.email)]) return ix.byMail[norm(r.email)];
  if(norm(r.name)  && ix.byName[norm(r.name)])  return ix.byName[norm(r.name)];
  return null;
}

function mergeEmployees(list){
  const ix = empIndex();
  let added = 0, updated = 0;
  list.forEach(r=>{
    if(!norm(r.name) && !norm(r.email) && !norm(r.empNo)) return;
    const cur = findEmp(ix, r);
    if(cur){
      let changed = false;
      DAOU_OWNED.forEach(f=>{
        if(r[f] && cur[f] !== r[f]){ cur[f] = r[f]; changed = true; }
      });
      /* 다우오피스 사번이 6pence가 임시로 매긴 EMP-xxxx 를 대체합니다 */
      if(r.empNo && cur.empNo !== r.empNo){ cur.empNo = r.empNo; changed = true; }
      if(changed) updated++;
    }else{
      const rec = Object.assign({_id:uid()}, defaultsFor("employees", 0));
      Object.keys(r).forEach(f=>{ if(r[f] !== "" && r[f] != null) rec[f] = r[f]; });
      DB.employees.push(rec);
      added++;
    }
    /* 새로 넣었든 고쳤든 색인을 갱신해 같은 실행 안에서 중복이 생기지 않게 한다 */
    const e = findEmp(ix, r) || DB.employees[DB.employees.length-1];
    if(norm(e.empNo) && !/^emp-/.test(norm(e.empNo))) ix.byNo[norm(e.empNo)] = e;
    if(norm(e.email)) ix.byMail[norm(e.email)] = e;
    if(norm(e.name))  ix.byName[norm(e.name)]  = e;
  });
  return {added, updated, total:list.length};
}

function autoSync(){
  if(!DIRECT) return Promise.resolve();
  /* 부서는 실패해도 임직원 최신화는 계속 진행한다 */
  return Promise.all([
    fetchEmployeesDirect(),
    fetchDeptsDirect().catch(e=>{ console.warn("부서 조회 실패", e); return null; })
  ]).then(([emps, depts])=>{
      const res  = mergeEmployees(emps || []);
      const dres = depts ? mergeDepts(depts) : {total:(DB._depts||[]).length};
      DAOU.syncError = null;
      DAOU.empNoReady = empNoReady();
      DB._sync = {at:new Date().toISOString(), count:(emps||[]).length, depts:dres.total};
      saveDB();
      if(res.added || res.updated || dres.changed){
        renderNav(); route();
        const parts = [];
        if(res.added)   parts.push(`추가 ${res.added}`);
        if(res.updated) parts.push(`갱신 ${res.updated}`);
        if(dres.changed) parts.push(`부서 ${dres.total}`);
        toast(`다우오피스 최신화 · ${parts.join(" · ")}`);
      }else{
        renderSyncBadge();
      }
      return res;
    })
    .catch(e=>{ DAOU.syncError = String(e.message || e); renderSyncBadge(); });
}

/* 매시 정각 자동 최신화 (여러 명이 접속해도 서버 캐시가 호출을 1회로 묶습니다) */
function scheduleHourlySync(){
  const now = new Date();
  const next = new Date(now);
  next.setHours(now.getHours() + 1, 0, 5, 0);      /* 정각 + 5초 */
  DAOU.nextSync = next;
  clearTimeout(scheduleHourlySync._t);
  scheduleHourlySync._t = setTimeout(()=>{
    autoSync().then(()=>scheduleHourlySync());
  }, next - now);
  renderSyncBadge();
}

/* 사이드바 하단 동기화 표시 */
function renderSyncBadge(){
  const el = document.getElementById("sync-line");
  if(!el) return;
  if(!DAOU.configured){
    el.innerHTML = `<b>프로토타입</b> · 데이터는 이 브라우저에만 저장됩니다`;
    return;
  }
  if(DAOU.syncError){
    el.innerHTML = `<span style="color:var(--danger)">다우오피스 연결 실패</span> · <a href="#" id="sync-now" style="color:var(--coral-deep);font-weight:600">다시 시도</a>`;
  }else{
    const fmt = d => d ? `${String(d.getHours()).padStart(2,"0")}:${String(d.getMinutes()).padStart(2,"0")}` : "-";
    const t = DB._sync ? new Date(DB._sync.at) : null;
    el.innerHTML = `다우오피스 최신화 <b>${fmt(t)}</b> · 임직원 ${rows("employees").length}명<br>
      다음 갱신 ${fmt(DAOU.nextSync)} (매시 정각)
      · <a href="#" id="sync-now" style="color:var(--coral-deep);font-weight:600">지금 갱신</a>`;
  }
  const btn = document.getElementById("sync-now");
  if(btn) btn.onclick = e=>{ e.preventDefault(); toast("다우오피스에서 다시 불러옵니다…"); autoSync({force:true}); };
}

/* 다우오피스 임직원 가져오기 → 일괄 등록 검사 화면으로 연결
   자동 최신화와 달리 "무엇이 들어오는지 눈으로 보고" 등록하고 싶을 때 씁니다. */
function pullDaou(){
  if(!DIRECT){ alert("먼저 데이터 관리 화면에서 다우오피스에 연결하세요."); return; }
  toast("다우오피스에서 불러오는 중…");
  fetchEmployeesDirect().then(list=>{
    const col = COLLECTIONS.employees;
    const cols = ["empNo","name","dept","position","type","joinDate","email","phone","status"];
    const head = cols.map(k=>col.fields.find(f=>f.k===k).l).join("\t");
    const body = list.map(r=>cols.map(k=>r[k]==null?"":r[k]).join("\t")).join("\n");
    openImport("employees");
    setTimeout(()=>{
      const ta = document.getElementById("imp-text");
      if(!ta) return;
      ta.value = head + "\n" + body;
      ta.dispatchEvent(new Event("input"));
      const rp = document.getElementById("imp-replace");
      if(rp){ rp.checked = true; rp.dispatchEvent(new Event("change")); }
    }, 60);
  }).catch(e=>alert("다우오피스 연동 실패\n\n" + (e.message || e)));
}

    `<button class="btn btn-sm" data-daou="${esc(a.act)}">${icon(a.ic,"ic-sm")} ${esc(a.label)}</button>`

/* 사번으로 다우오피스 계정 찾기 — 다우오피스가 준 사번만 유효 */
function empNoOf(name){
  const e = rows("employees").find(x=>x.name===name);
  const no = e ? String(e.empNo || "") : "";
  return /^EMP-/.test(no) ? "" : no;
}
/* 사번이 있는 임직원 (알림 받는 사람 후보) */
function notiCandidates(){
  return rows("employees")
    .filter(e=>e.status !== "퇴사" && e.empNo && !/^EMP-/.test(e.empNo))
    .sort((a,b)=>String(a.dept||"").localeCompare(String(b.dept||""),"ko") ||
                 String(a.name||"").localeCompare(String(b.name||""),"ko"));
}

function daouPost(path, body, method){
  if(!DIRECT) return Promise.resolve({error:"다우오피스에 연결되어 있지 않습니다."});
  if(path === "noti") return daouDirect("/public/v1/noti", {
    sender: body.sender || DIRECT.senderEmpNo || "",
    receivers: body.receivers, message: body.message,
    mailTitle: body.mailTitle || body.message,
    mailMessage: body.mailMessage || body.message,
    linkUrl: body.linkUrl
  }).then(d=>({result:d})).catch(e=>({error:String(e.message||e)}));
  if(path === "attendance") return daouDirect("/public/v2/attnd/record", {data: body.data})
    .then(d=>({result:d, count:(body.data||[]).length})).catch(e=>({error:String(e.message||e)}));
  if(path === "works") return daouDirect("/public/v1/works",
    {token: DIRECT.worksToken || "", params: body.params || {}}, method)
    .then(d=>({result:d})).catch(e=>({error:String(e.message||e)}));
  return Promise.resolve({error:"지원하지 않는 요청입니다"});
}

/* ------------------------------------------------------------
   알림 발송 창 — 받는 사람을 눈으로 확인하고 고쳐서 보냅니다
   담당자 칸이 비어 있는 화면도 여기서 직접 고르면 발송됩니다.
   ------------------------------------------------------------ */
function openNotiModal(id, picked){
  const m = NOTI_MAP[id];
  const col = COLLECTIONS[id];
  const cands = notiCandidates();

  /* 선택한 행의 담당자 → 사번 */
  const preset = new Set();
  const missing = [];
  picked.forEach(r=>{
    const nm = m.owner ? String(r[m.owner] || "").trim() : "";
    if(!nm) return;
    const no = empNoOf(nm);
    no ? preset.add(no) : missing.push(nm);
  });

  const titles = picked.map(r=>String(r[m.title] || "")).filter(Boolean);
  const head = titles.slice(0,3).join(", ") + (titles.length > 3 ? ` 외 ${titles.length-3}건` : "");
  const dues = picked.map(r=>r[m.due]).filter(Boolean).sort();
  const defMsg = `[6pence] ${col.title} — ${head}${dues.length ? ` (기한 ${dues[0]})` : ""} 확인이 필요합니다.`;

  modalEl = document.createElement("div");
  modalEl.className = "overlay";
  modalEl.innerHTML = `<div class="modal">
    <div class="modal-head"><div><h3>알림 발송</h3>
      <div class="sub">${esc(col.title)} ${picked.length}건 · 다우오피스 알림 + 메일로 전달됩니다</div></div></div>
    <div class="modal-body">
      ${missing.length ? `<div class="note" style="margin-bottom:12px;background:var(--warn-bg)">${icon("alert","ic-sm")}
        <div>사번이 없어 자동으로 잡지 못한 담당자: <b>${esc([...new Set(missing)].join(", "))}</b><br>
        아래에서 직접 골라 주세요.</div></div>` : ""}
      <div class="form-row" style="display:block">
        <label style="display:block;margin-bottom:6px">보낼 내용</label>
        <textarea id="noti-msg" rows="3" style="width:100%">${esc(defMsg)}</textarea>
      </div>
      <div class="form-row" style="display:block;margin-top:14px">
        <label style="display:block;margin-bottom:6px">받는 사람
          <span class="form-hint">사번이 등록된 임직원만 보입니다 (${cands.length}명)</span></label>
        <input id="noti-q" placeholder="이름·부서로 찾기" style="width:100%;margin-bottom:8px">
        <div id="noti-list" style="max-height:230px;overflow:auto;border:1px solid var(--line);border-radius:var(--radius-sm)"></div>
      </div>
    </div>
    <div class="modal-foot">
      <span class="muted" id="noti-count" style="margin-right:auto"></span>
      <button class="btn" id="noti-cancel">취소</button>
      <button class="btn btn-primary" id="noti-send">${icon("upload","ic-sm")} 보내기</button>
    </div></div>`;
  document.body.appendChild(modalEl);
  document.body.style.overflow = "hidden";
  modalEl.onclick = e => { if(e.target===modalEl) closeModal(); };

  const chosen = new Set(preset);
  const listEl  = modalEl.querySelector("#noti-list");
  const countEl = modalEl.querySelector("#noti-count");
  const qEl     = modalEl.querySelector("#noti-q");

  function paint(){
    const q = qEl.value.trim().toLowerCase();
    const view = cands.filter(e=>!q ||
      String(e.name||"").toLowerCase().includes(q) || String(e.dept||"").toLowerCase().includes(q));
    listEl.innerHTML = view.length ? view.map(e=>`
      <label class="list-row" style="padding:8px 14px;cursor:pointer">
        <input type="checkbox" data-no="${esc(e.empNo)}" ${chosen.has(e.empNo)?"checked":""}>
        <div class="list-main" style="margin-left:10px">
          <div class="t">${esc(e.name)} <span class="muted" style="font-weight:400">${esc(e.position||"")}</span></div>
          <div class="s">${esc(e.dept||"부서 미지정")} · 사번 ${esc(e.empNo)}</div>
        </div>
      </label>`).join("") : `<div class="empty" style="padding:24px">찾는 사람이 없습니다.</div>`;
    listEl.querySelectorAll("[data-no]").forEach(b=>b.onchange=()=>{
      b.checked ? chosen.add(b.dataset.no) : chosen.delete(b.dataset.no);
      countEl.textContent = `${chosen.size}명 선택`;
    });
    countEl.textContent = `${chosen.size}명 선택`;
  }
  paint();
  qEl.addEventListener("input", paint);

  modalEl.querySelector("#noti-cancel").onclick = closeModal;
  modalEl.querySelector("#noti-send").onclick = ()=>{
    const msg = modalEl.querySelector("#noti-msg").value.trim();
    if(!chosen.size){ alert("받는 사람을 한 명 이상 고르세요."); return; }
    if(!msg){ alert("보낼 내용을 입력하세요."); return; }
    const btn = modalEl.querySelector("#noti-send");
    btn.disabled = true; btn.textContent = "보내는 중…";
    daouPost("noti", {
      receivers: [...chosen], message: msg,
      mailTitle: `[6pence] ${COLLECTIONS[id].title} 처리 안내`, mailMessage: msg,
      linkUrl: location.origin + location.pathname + "#/" + id
    }).then(j=>{
      if(j.error){ alert("알림 발송 실패\n\n" + j.error); btn.disabled = false; btn.textContent = "보내기"; return; }
      const valid = (j.result && j.result.validReceivers) || {};
      const bad   = (j.result && j.result.invalidReceivers) || {};
      closeModal();
      toast(`${Object.keys(valid).length || chosen.size}명에게 알림을 보냈습니다.`);
      if(Object.keys(bad).length) alert("일부 수신 실패\n\n" + JSON.stringify(bad, null, 1));
    });
  };
}

/* ------------------------------------------------------------
   다우오피스 동작 실행
   ------------------------------------------------------------ */
function daouAction(id, act, sel){
  if(!DIRECT){ alert("먼저 데이터 관리 화면에서 다우오피스에 연결하세요."); return; }

  /* 임직원 갱신은 선택이 필요 없다 */
  if(act === "sync"){
    toast("다우오피스에서 다시 불러옵니다…");
    return autoSync().then(r=>{
      if(r && !r.added && !r.updated) toast("이미 최신 상태입니다.");
    });
  }

  /* 다우오피스가 준 명부를 표로 확인한 뒤 등록 */
  if(act === "pull") return pullDaou();

  /* 사전 설정 확인 */
  const have = DAOU.have || {};
  if(act === "approval" && !have.formCode)             return showSetup("approval");
  if(act === "works" && !(DIRECT && DIRECT.worksToken)) return showSetup("worksToken");
  if((act === "attnd" || act === "noti") && !DAOU.empNoReady) return showSetup("empNo");

  const picked = rows(id).filter(r=>sel.has(r._id));
  if(!picked.length){
    alert("먼저 표에서 보낼 항목을 선택하세요.\n각 행 왼쪽 체크박스로 고른 뒤 다시 눌러 주세요.");
    return;
  }

  /* ---- 전자결재 기안 (다우오피스 기안 화면이 새 창으로 열립니다) ---- */
  if(act === "approval"){
    const build = APPROVAL_DOCS[id];
    if(!build){ alert("이 화면은 전자결재 상신을 지원하지 않습니다."); return; }
    if(picked.length > 1){
      alert("전자결재는 기안 화면이 창으로 열리기 때문에 한 번에 한 건만 상신합니다.\n한 건만 선택해 주세요.");
      return;
    }
    const doc = build(picked[0]);
    approvalSubmitDirect({title:doc.title, content:doc.content,
                          draftEmpNo:doc.empNo, partnerDocId:doc.docId});
    toast("다우오피스 기안 화면을 새 창으로 열었습니다.");
    return;
  }

  /* ---- 근태 기록 등록 ---- */
  if(act === "attnd"){
    const data = [], skipped = [];
    picked.forEach(r=>{
      const no = empNoOf(r.name);
      if(!no){ skipped.push(r.name); return; }
      data.push({employeeNumber:no, workingDay:r.startDate, code:r.kind});
    });
    if(!data.length){
      alert("보낼 수 있는 항목이 없습니다.\n다우오피스와 6pence의 사번(employeeNumber)이 맞아야 전송됩니다.");
      return;
    }
    if(!confirm(`${data.length}건을 다우오피스 근태로 전송합니다.${skipped.length?`\n사번이 없어 제외: ${skipped.join(", ")}`:""}\n계속할까요?`)) return;
    daouPost("attendance", {data}).then(j=>{
      if(j.error) alert("전송 실패\n\n" + j.error);
      else toast(`${j.count}건을 다우오피스로 전송했습니다.`);
    });
    return;
  }

  /* ---- Works 로 업무 보내기 ---- */
  if(act === "works"){
    if(!confirm(`${picked.length}건을 다우오피스 Works 로 보냅니다.\n계속할까요?`)) return;
    toast("Works 로 보내는 중…");
    worksPushDirect(id, picked).then(({ok, fails})=>{
      if(ok) toast(`${ok}건을 Works 로 보냈습니다.`);
      if(fails.length) alert(`${fails.length}건 실패\n\n` + fails.slice(0,10).join("\n"));
      else if(!ok) alert("보낸 항목이 없습니다.");
    });
    return;
  }

  /* ---- 알림 발송 ---- */
  if(act === "noti"){
    if(!NOTI_MAP[id]){ alert("이 화면은 알림 발송을 지원하지 않습니다."); return; }
    openNotiModal(id, picked);
    return;
  }
}

function init(){
  loadDB();
  resolveDirect();
  checkDaou();
  document.getElementById("nav").addEventListener("click", e=>{
    const t = e.target.closest("[data-toggle]");
    if(t){ const g=t.dataset.toggle; state.openGroups.has(g)?state.openGroups.delete(g):state.openGroups.add(g);
      t.parentElement.classList.toggle("open"); return; }
    const s = e.target.closest("[data-go]");
    if(s && s.tagName==="BUTTON"){ go(s.dataset.go); }
  });
  const si = document.getElementById("gsearch");
  si.addEventListener("input", e=>globalSearch(e.target.value));
  si.addEventListener("focus", e=>{ if(e.target.value) globalSearch(e.target.value); });
  document.addEventListener("click", e=>{
    if(!e.target.closest(".top-search") && !e.target.closest("#search-result"))
      document.getElementById("search-result").style.display="none";
    if(e.target.closest("#search-result a")){ si.value=""; document.getElementById("search-result").style.display="none"; }
  });
  document.getElementById("menu-btn").onclick = ()=>document.querySelector(".sidebar").classList.toggle("show");
  document.getElementById("reset-btn").onclick = ()=>{
    if(!confirm("모든 데이터를 샘플 초기 상태로 되돌립니다. 계속할까요?")) return;
    localStorage.removeItem(DB_KEY); DB=null; loadDB(); route(); toast("샘플 데이터로 초기화했습니다.");
  };
  document.addEventListener("keydown", e=>{
    if(e.key==="Escape") closeModal();
    if((e.metaKey||e.ctrlKey) && e.key==="k"){ e.preventDefault(); si.focus(); }
  });
  window.addEventListener("hashchange", route);
  route();
}
document.addEventListener("DOMContentLoaded", init);
